:["Coloque os filés dentro de um recipiente, tempere com sal, alho, pimenta e o limão.","Deixe descansar por 20 minutos para que pegue bem o sabor.","Depois bata levemente o ovo, passe os filés na farinha de aveia, no ovo e depois nos flocos de aveia.","Coloque os filés de peixe na cesta da sua Airfryer de 15 a 20 minutos a 200 °C, ou até ficar douradinho."],"origin":"source"},{"id":133,"title":"Frango Empanado Com Farofa","cat":"almoco","tags":["Frango"],"yield":null,"temp":"200°C","time":null,"timeMin":null,"diff":"Mais Elaborado","ingr":["600 g de peito de frango (sem osso)","1 colher (sopa) mostarda escura","1 colher (chá) de páprica defumada","2 dentes de alho amassados","1 colher (sopa) de suco de limão","Uma pitada de canela em pó","Pimenta preta moída na hora","Sal","2 ovos (para empanar)","Farofa temperada","2 xícaras de farinha de rosca","30 g de manteiga","Ervas desidratada","2 dentes de alho amassados","1 colher (chá) de páprica defumada","Pimenta preta moída na hora","Sal"],"steps":["Corte o peito de frango, a fim de obter tiras longas de filés de tamanho uniforme.","Tempere com mostarda, suco de limão, páprica, alho, canela, pimenta e sal.","Misture bem e deixe descansando por no mínimo meia hora.","Enquanto isso prepare a farofa, em uma frigideira coloque a manteiga, assim que estiver quente, coloque o alho e deixe refogar sem queimar.","Acrescente a farinha de rosca e os outros temperos e refogue em fogo baixo até que a farinha esteja dourada e sequinha, mexendo sempre para não queimar.","Reserve a farofa para esfriar.","Em um bowl bata os dois ovos.","Coloque um pouco de farofa em outro bowl.","Em seguida, passe cada pedaço de frango pelo ovo e depois pela farofa e pressione levemente a fim de deixar cada pedaço bem envolto pela farinha.","Assim que todos os pedaços estiverem empanados, coloque na Airfryer a 200 °C, durante o cozimento vire para que eles fiquem com cozidos uniformemente."],"origin":"source"},{"id":134,"title":"Filé De Frango Grelhado","cat":"almoco","tags":["Frango"],"yield":null,"temp":"180°C","time":"5 min","timeMin":5,"diff":"Médio","ingr":["1 kg de peito de frango desossado","1 colher (sopa) de páprica doce","2 dentes de alho","1 colher (sopa) de azeite de oliva","1 colher (chá) de orégano","1 colher (chá) de sal","Pimenta-do-reino em grãos moída a gosto"],"steps":["Corte o peito de frango em filés.","Tempere os filés com páprica, alho picado, orégano, azeite, sal e pimenta.","Deixe por 20 minutos, marinando.","Coloque os filés na Airfryer e asse em 180 ºC por 15 minutos, com oito minutos, vire os files, para que cozinhem por igual.","Retire da fritadeira, se os filés ainda não estiverem no ponto desejado, deixe por mais 5 minutos."],"origin":"source"},{"id":135,"title":"Frango Inteiro","cat":"almoco","tags":["Frango"],"yield":null,"temp":"200°C","time":"10 min","timeMin":10,"diff":"Mais Elaborado","ingr":["1 Frango inteiro limpo","1 pimentão verde pequeno picado","1 colher (sopa) de sal","2 dentes de alho triturado","1 maço de Salsa picada","1 colher (café) de colorífico","5 folhas de louro picadas","2 cebolas médias picadas","1 tablete de Caldo de Frango","50 ml de vinho branco seco","Vinagre vermelho para lavar o frango"],"steps":["Antes de começar, lave bem o frango com água corrente.","No liquidificador, bata todos os ingredientes, exceto o vinagre e reserve.","Em seguida lave o frango com o vinagre, por dentro e por fora.","Passe a mistura do liquidificador no frango, por dentro e por fora.","Coloque o frango dentro de um saquinho com o tempero e deixe repousar de um dia para o outro.","Passado esse tempo, retire o frango do saquinho, desprezando o tempero que ficou.","Coloque o frango na cesta da Airfryer com o peito virado para baixo.","Programe a sua Airfryer por 20 minutos a 200 ºC.","Passado esse tempo, vire o frango e com o peito para cima e programe por mais 20 minutos a 200 ºC.","Depois desse tempo verifique se está no ponto desejado, caso queira ainda mais passado, deixe por mais dez minutos e abra a fritadeira, caso queira deixar mais, vire novamente, deixando por mais 10 minutos.","Continue esse procedimento até ficar como desejado."],"origin":"source"},{"id":136,"title":"Frango A Passarinho","cat":"almoco","tags":["Frango"],"yield":null,"temp":"200°C","time":"10 min","timeMin":10,"diff":"Mais Elaborado","ingr":["1 kg de frango cortado à passarinho","1 colher (chá) de sal","Pimenta-do-reino preta a gosto","2 colheres (sopa) de farinha de trigo","1 colher (sopa) de azeite"],"steps":["Retire o frango da geladeira e deixe por cerca de 10 minutos em temperatura ambiente.","Pré-aqueça a Airfryer a 200 ºC por 5 minutos.","Passado o tempo, coloque o frango numa tigela e seque com um papel- toalha.","Tempere com sal e pimenta a gosto.","Polvilhe a farinha no frango e misture bem para envolver todos os pedaços.","Regue com o azeite e misture novamente.","Transfira o frango para a Airfryer e programe 30 minutos, a cada 10 minutos abra o cesto e com a ajuda de um pegador de massa vire os pedaços de frango para dourar por igual.","Retire da fritadeira e sirva a seguir com o molho de sua preferência."],"origin":"source"},{"id":137,"title":"Churrasco De Picanha Com Carvão","cat":"almoco","tags":["Carne"],"yield":null,"temp":"200°C","time":"10 min","timeMin":10,"diff":"Mais Elaborado","ingr":["1 kg picanha","Sal grosso a gosto","1 Pedaço pequeno de carvão"],"steps":["Primeiro prepare a picanha cortando um pouco da gordura, deixando o suficiente apenas para dar um gostinho.","Faça pequenos cortes nesta área para que o sal grosso penetre bem.","Evite cortar a picanha contra as fibras, pois o suco da carne sai todo e ela perde o gosto, além de ficar mais seca.","Coloque sal grosso a gosto e deixe descansar por 5 minutos.","Enquanto isso pré aqueça a Airfryer a 200 ºC.","Bata um pouco a carne depois de descansa-la para tirar o excesso de sal.","Então coloque a picanha na Airfryer de um lado e deixe fritar por 5 minutos.","Acenda o carvão, pode ser no fogão mesmo, pra iniciar uma brasinha, a Airfryer irá fazer a fumaça circular dentro do cesto dando o sabor e odor tradicional.","Acomode o carvão na cesta da Airfryer de um lado e a picanha virada do outro lado.","Então coloque para assar por mais 10 minutos."],"origin":"source"},{"id":138,"title":"Churrasco De Contra Filé","cat":"almoco","tags":["Carne"],"yield":null,"temp":"200°C","time":"6 min","timeMin":6,"diff":"Médio","ingr":["600 g de contra filé grill","Sal grosso a gosto"],"steps":["Aqueça a fritadeira elétrica por cinco minutos.","Deposite a carne temperada com cuidado de deixar a gordura para baixo.","Regule em 12 minutos a 200 °C, bata o excesso de sal e se estiver no ponto basta tirar do cesto e servir.","Caso prefira mais passado, volte carne a fritadeira, aumentando o tempo de preparo em 6 minutos, olhando sempre para verificar o ponto da carne."],"origin":"source"},{"id":139,"title":"Medalhão De Filé Mignon Com Molho De Gorgonzola","cat":"janta","tags":["Carne"],"yield":null,"temp":"200°C","time":"10 min","timeMin":10,"diff":"Médio","ingr":["4 medalhões de filé mignon","1 xícara de requeijão","1 colher (sopa) de queijo gorgonzola","2 colheres (sopa) de leite","Pimenta-do-reino","Sal"],"steps":["Tempere a carne com pimenta e sal a gosto.","Coloque na Airfryer preaquecida e cozinhe por 10 minutos a 200 °C, virando-os aos cinco minutos, para que fritem por igual.","Enquanto isso prepare o molho.","Pegue uma panela e, em fogo baixo, derreta o gorgonzola junto com o leite.","Quando os medalhões ficarem prontos, sirva-os cobertos com o molho."],"origin":"source"},{"id":140,"title":"Iscas De Filé Mignon","cat":"almoco","tags":["Carne"],"yield":null,"temp":null,"time":"20 min","timeMin":20,"diff":"Médio","ingr":["400 g de filé mignon cortado em tiras","2 colheres (sopa) de molho inglês","2 dentes de alho amassado","Pimenta","Sal"],"steps":["Misture o molho inglês e o alho.","Cubra a carne com a mistura e mexa bem, para que fique uniforme.","Coloque na geladeira e reserve por 15 minutos.","Tempere com a pimenta e o sal, e coloque na Airfryer.","Cozinhe por 20 minutos em temperatura média.","Mexa a carne na metade do tempo para que cozinhe por igual."],"origin":"source"},{"id":141,"title":"Costela Bovina","cat":"almoco","tags":["Carne"],"yield":null,"temp":"200°C","time":"10 min","timeMin":10,"diff":"Médio","ingr":["500 g de costela bovina","Pimenta do reino e sal a gosto"],"steps":["Tempere a costela com sal e pimenta a gosto.","Utilize um papel alumínio para fazer um envelope embrulhando as costelas, deixando as dobras do papel para baixo.","Em seguida, coloque na Airfryer de sua preferência e siga as duas etapas de tempo e temperatura: deixe 60 minutos a 180 ºC com o envelope de alumínio e por 10 minutos sem envelope a 200 ºC.","Retire e sirva."],"origin":"source"},{"id":142,"title":"Costela De Porco Frita","cat":"almoco","tags":["Carne"],"yield":null,"temp":"200°C","time":"10 min","timeMin":10,"diff":"Mais Elaborado","ingr":["700 g de costela suína cortada em ripas","1 dente de alho amassado","½ limão espremido","1 colher (chá) de sal","1 colher (chá) de ervas finas desidratadas","1 colher (chá) de páprica defumada ou picante","1 colher (café) de pimenta do reino","1 colher (café) de louro moído ou 1 folha de louro rasgada","1 colher (café) de mostarda em pó ou de molho de mostarda","1 colher (sopa) de alho fatiado"],"steps":["Misture bem os temperos e espalhe a mistura nos pedaços de costela.","Cubra e deixe descansar na geladeira por pelo menos 60 minutos.","Enquanto isso, pré-aqueça a Airfryer por 10 minutos em 200 ºC.","Espalhe os pedaços da costela no cesto da Airfryer.","Coloque a gaveta na Airfryer por 10 minutos em 180 ºC.","Abra a gaveta e vire os pedaços, retornando para mais 10 minutos em 180 ºC.","Retire novamente a gaveta, vire mais uma vez e distribua o alho por cima.","Retorne para mais 10 minutos em 200 ºC e sirva em seguida.","A carne deve ficar dourada."],"origin":"source"},{"id":143,"title":"Bife","cat":"almoco","tags":["Carne"],"yield":null,"temp":"200°C","time":"7 min","timeMin":7,"diff":"Médio","ingr":["500 g de bifes de sua preferência","Pimenta","Sal."],"steps":["Tempere o bife com pimenta e sal.","Na Airfryer preaquecida, ajuste a temperatura para 200 °C e programe para 7 minutos.","Vire os bifes e cozinhe por mais 7 minutos.","Verifique o ponto e sirva em seguida."],"origin":"source"},{"id":144,"title":"Costelinha De Porco Ao Molho Barbecue","cat":"almoco","tags":["Carne"],"yield":null,"temp":"200°C","time":"35 min","timeMin":35,"diff":"Médio","ingr":["½ kg de costelinha de porco","Molho tipo barbecue","Suco de ½ limão","1 colher (sopa) de alho espremido ou triturado","1 colher (sopa) de alecrim fresco ou seco","1 colher (sopa) de azeite","1 pitada de pimenta calabresa","1 pitada de pimenta-do-reino","Sal a gosto"],"steps":["Primeiro faça um marinado com o suco do limão, o alho, alecrim, azeite, as pimentas e o sal, misture tudo em uma vasilha pequena, e reserve.","Depois corte a costela de porco em pedaços entre os ossinhos.","Coloque os pedaços de costela dentro um saquinho plástico grosso e despeje sobre eles o tempero, feche bem o saco retirando o máximo de ar de dentro e deixe marinando por no mínimo uma hora.","Após marinar, retire as costelas do saquinho e coloque na cesta da Airfryer, depois pincele generosamente com molho barbecue.","Programe a Airfryer por 35 minutos a 200 °C, na metade do tempo vire as costelinhas e pincele com mais molho barbecue."],"origin":"source"},{"id":145,"title":"Bife A Milanesa — Versão 2","cat":"almoco","tags":["Carne"],"yield":null,"temp":"200°C","time":"10 min","timeMin":10,"diff":"Mais Elaborado","ingr":["4 bifes finos","2 ovos","Farinha de rosca","Tempero a gosto."],"steps":["Tempere os bifes da forma como desejar, com os temperos que mais gosta, e deixe reservado por alguns minutos para absorver bem o marinado.","Em uma vasilha, bata os ovos.","Em outra, coloque a farinha de rosca.","Passe a carne pelo ovo e depois pela farinha de rosca.","Retire o excesso de ovo e farinha e coloque os bifes na Airfryer.","Programe para cozinhar por 20 minuto as 200 °C.","Vire a carne quando der 10 minutos para que cozinhe por igual.","Quando a carne estiver no ponto, basta servir com o acompanhamento que mais lhe agradar."],"origin":"source"},{"id":146,"title":"Lasanha Ao Sugo","cat":"janta","tags":["Massas","Carne"],"yield":null,"temp":"160°C","time":"17 min","timeMin":17,"diff":"Mais Elaborado","ingr":["1 pacote de massa de lasanha","1 caixinha de molho de tomate","200 g de fiambre","200 g de mussarela","Queijo parmesão fresco ralado"],"steps":["Em um recipiente com água coloque a massa da lasanha uma a uma e deixe por 5 minutos Agora na forminha fechada (sem furos) da Airfryer.","Faça uma leve camada de molho Em seguida faça uma camada com a massa, se for preciso quebre um pedacinho da massa.","Depois faça uma camada de molho, uma camada de mussarela e uma camada de fiambre.","Repita o processo até terminar com uma camada de massa e por cima o molho.","Finalize com parmesão ralado.","Aqueça a Airfryer por 3 minutos em 160 ºC.","Em seguida coloque a forminha fechada dentro da cesta com furinhos na Airfryer.","Ajuste o timer por 17 minutos na temperatura de 160 ºC.","Depois desse tempo a lasanha esta pronta para ser servida."],"origin":"source"},{"id":147,"title":"Lasanha De Berinjela — Versão 1","cat":"janta","tags":["Massas","Legumes"],"yield":null,"temp":"160°C","time":"20 min","timeMin":20,"diff":"Fácil","ingr":["2 berinjelas pequenas","500 ml de molho de tomate","Couve-flor e brócolis cozidos a gosto","500 g de mussarela"],"steps":["Corte as berinjelas no sentido do cumprimento vertical, coloque na Airfryer por 15 minutos a 200 °C.","Retire e inicie a montagem em camadas em um refratário resistente ao calor e que caiba na sua fritadeira, colocando primeiro o molho e, em seguida, intercalando as camadas de berinjela, molho, legumes e queijo até acabar.","Coloque na Airfryer por 20 minutos a 160 °C e sirva em seguida."],"origin":"source"},{"id":148,"title":"Lasanha De Berinjela — Versão 2","cat":"janta","tags":["Massas","Legumes"],"yield":null,"temp":"180°C","time":"7 min","timeMin":7,"diff":"Médio","ingr":["Berinjelas em rodelas","Refogue cebola picada com azeite","Molho de tomate fresco"],"steps":["Corte a berinjela em rodelas, duas unidades de berinjela aproximadamente.","Deixe de molho em água com sal por aproximadamente 30 minutos para tirar o amargor.","Escorra a água e seque com papel toalha.","Leve a frigideira sem óleo para grelhar dos dois lados ou colocar as rodelas na Airfryer por 7 minutos em 180 ºC.","Para montar a lasanha forre uma camada de berinjela, molho e queijo mussarela (ou de sua preferência) e repita até terminar os ingredientes, cubra com molho e queijo parmesão ralado.","Depois de montada leve ao forno para derreter o queijo e aquecer."],"origin":"source"},{"id":149,"title":"Canellonni Quatro Queijos","cat":"janta","tags":["Massas","Queijo"],"yield":null,"temp":"160°C","time":"20 min","timeMin":20,"diff":"Médio","ingr":["1 rolo de massa fresca para pastéis","100 g de queijo mussarela","50 g de queijo gorgonzola","50 g de queijo provolone","100 g de requeijão culinário","Azeite a gosto","300 ml de molho branco"],"steps":["Abra a massa e corte em tiras largas, de cerca de 10 cm.","Recheie as porções com os queijos, enrole e feche as pontas, pincelando com azeite.","Coloque na assadeira da Airfryer, cubra com o molho e leve para assar a 160 °C por 20 minutos.","Sirva em seguida."],"origin":"source"},{"id":150,"title":"Lasanha De Abobrinha","cat":"janta","tags":["Massas","Legumes"],"yield":null,"temp":"180°C","time":"15 a 20 min","timeMin":20,"diff":"Mais Elaborado","ingr":["3 a 4 abobrinhas","300 g de ricota","5 tomates maduros","Ervas, frescas ou secas.","Sal","Pimenta-do-reino","Azeite","Queijo parmesão ralado para gratinar"],"steps":["Lave bem as abobrinhas e seque-as.","Fatie em lâminas no sentido do comprimento, com espessura máxima de 0,5 cm.Coloque as fatias na fritadeira Air Fryer e salpique com sal e pimenta.","Programe o timer para 3 a 5 minutos para que cozinhem levemente.","Em uma tigela ou prato, amasse bem a ricota, tempere com ervas, sal e azeite, reserve.","Após lavar bem e secar os tomates, retire as sementes e pique em pedaços bem pequenos.","Se preferir, triture-os rapidamente em um processador de alimentos.","Tempere com sal, azeite, ervas e pimenta, e reserve.","Em uma travessa que caiba dentro da fritadeira, inicie a montagem da lasanha, fazendo uma camada de abobrinha, em seguida, de ricota, molho de tomates frescos, repetindo as camadas até preencher todo o recipiente.","Finalize com parmesão ralado e leve para assar e gratinar na fritadeira Airfryer, programando o tempo para 15 a 20 minutos, a 180 ºC ou até que fique bem dourada."],"origin":"source"},{"id":151,"title":"Bacon Sequinho","cat":"petiscos","tags":["Carne"],"yield":null,"temp":"200°C","time":"5 min","timeMin":5,"diff":"Fácil","ingr":["300 g de Bacon em fatias finas"],"steps":["Compre o bacon em fatias finas e longas, ou compre uma peça e corte em fatias bem finas.","Coloque o bacon na cesta da sua fritadeira elétrica Programe o tempo para 200 °C por 15 minutos A cada 5 minutos, com a ajuda de um pegador de salada vire as fatias de bacon.","Depois deixe esfriar por 1 minuto e sirva em seguida."],"origin":"source"},{"id":152,"title":"Hambúrguer Temperado","cat":"janta","tags":["Carne"],"yield":null,"temp":"180°C","time":"7 a 15 min","timeMin":15,"diff":"Fácil","ingr":["500 g de carne moída","¼ cebola pequena bem picada","1 dentes de alho pequeno","Ervas finas","Sal"],"steps":["Pique a cebola e o alho.","Coloque todos os ingredientes em uma vasilha e misture bem.","Modele os hambúrgueres, coloque na Airfryer e programe para 180 °C, de 7 a 15 minutos, dependendo da altura dos seus hambúrgueres e do ponto de preferência da carne."],"origin":"source"},{"id":153,"title":"Hambúrguer Com Creem Cheese","ca }

function matchesQuery(r, q){
  if(!q) return true;
  q = q.toLowerCase();
  if(r.title.toLowerCase().includes(q)) return true;
  if(r.tags.some(t => t.toLowerCase().includes(q))) return true;
  if(CAT_BY_ID[r.cat].name.toLowerCase().includes(q)) return true;
  if(r.ingr.some(i => i.toLowerCase().includes(q))) return true;
  return false;
}
function applyFilters(list){
  const f = state.filters;
  return list.filter(r => {
    if(f.type && !r.tags.includes(f.type)) return false;
    if(f.diff && r.diff !== f.diff) return false;
    if(f.time === 10 && !(r.timeMin && r.timeMin <= 10)) return false;
    if(f.time === 20 && !(r.timeMin && r.timeMin <= 20)) return false;
    if(f.time === 30 && !(r.timeMin && r.timeMin <= 30)) return false;
    if(f.time === '30plus' && !(r.timeMin && r.timeMin > 30)) return false;
    return true;
  });
}
function dayseed(){
  const d = new Date();
  const start = new Date(d.getFullYear(),0,0);
  const diff = d - start;
  return Math.floor(diff / 86400000);
}
function seededPick(arr, n, seed){
  const a = arr.slice();
  // simple LCG shuffle seeded by 'seed'
  let s = seed || 1;
  function rnd(){ s = (s * 9301 + 49297) % 233280; return s / 233280; }
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a.slice(0, n);
}

  clearTimeout(window.__toastTimer);

}

// ============ CONTENT-DERIVED CALLOUTS (never invented — extracted from the recipe's own text) ============
function findSentenceWith(list, regex){
  for(const s of list){
    if(!s || s.startsWith('§')) continue;
    if(regex.test(s)){
      const m = s.match(regex);
      // try to return just the containing clause/sentence, else the whole line
      const parts = s.split(/(?<=[.!?])\s+/);
      const hit = parts.find(p => regex.test(p));
      return (hit || s).trim();
    }
  }
  return null;
}
function extractPreheat(r){ return findSentenceWith(r.steps, /pr[ée]-?aque[çc]a|pr[ée]-aquecida/i); }
function extractFlip(r){ return findSentenceWith(r.steps, /\bvir(e|ando|ar|e-os|e-as)\b|virando na metade|sacudindo a cesta/i); }
function extractDica(r){ return findSentenceWith(r.steps, /\bdica\b/i) || findSentenceWith(r.ingr, /\bdica\b/i); }
function extractAtencao(r){ return findSentenceWith(r.steps, /\baten[çc][ãa]o\b|\bcuidado\b/i); }

// ============ PORTION CALCULATOR ============
function parseYieldBase(y){
  if(!y) return null;
  const m = y.match(/(\d+)/);
  return m ? parseInt(m[1], 10) : null;
}
function yieldUnitLabel(y){
  if(!y) return '';
  const m = y.match(/\d+\s*(.*)$/);
  return m ? m[1].trim() : y;
}
const FRAC_MAP = {'½':0.5,'⅓':1/3,'⅔':2/3,'¼':0.25,'¾':0.75,'⅛':0.125};
const FRAC_LIST = [[0.75,'¾'],[0.67,'⅔'],[0.5,'½'],[0.33,'⅓'],[0.25,'¼'],[0.125,'⅛']];
function parseLeadingQty(text){
  if(/^\d+\s*a\s*\d+\s/i.test(text)) return null; // ranges: don't guess, leave as-is
  const m = text.match(/^(\d+[.,]\d+|\d+\s?[½⅓⅔¼¾⅛]|\d+|[½⅓⅔¼¾⅛])(g|kg|ml|L)?(\b|\s)/);
  if(!m) return null;
  const raw = m[1];
  const unit = m[2] || '';
  let val;
  if(/^\d+\s?[½⅓⅔¼¾⅛]$/.test(raw)){
    val = parseInt(raw, 10) + FRAC_MAP[raw.slice(-1)];
  } else if(FRAC_MAP[raw] !== undefined){
    val = FRAC_MAP[raw];
  } else {
    val = parseFloat(raw.replace(',', '.'));
  }
  if(Number.isNaN(val)) return null;
  return { value: val, matchLength: raw.length, unit };
}
function formatQty(n){
  const rounded = Math.round(n * 100) / 100;
  if(Number.isInteger(rounded)) return String(rounded);
  const whole = Math.floor(rounded);
  const frac = rounded - whole;
  for(const [v, sym] of FRAC_LIST){
    if(Math.abs(frac - v) < 0.06) return (whole > 0 ? whole + ' ' : '') + sym;
  }
  return String(Math.round(rounded * 10) / 10);
}
function scaleIngredientText(text, factor){
  if(Math.abs(factor - 1) < 0.001) return text;
  const parsed = parseLeadingQty(text);
  if(!parsed) return text;
  // grams/ml/kg/L glued to the number read oddly as fractions (e.g. "266⅔g") — round to whole units instead
  const qtyStr = parsed.unit ? String(Math.max(1, Math.round(parsed.value * factor))) : formatQty(parsed.value * factor);
  return qtyStr + parsed.unit + text.slice(parsed.matchLength + parsed.unit.length);
}
function getPortionFactor(r){
  const base = parseYieldBase(r.yield);
  if(!base) return 1;
  const target = state.portions[r.id] || base;
  return target / base;
}

// ============ "O QUE TENHO EM CASA" ============
function matchByIngredients(inputText){
  const terms = inputText.toLowerCase().split(',').map(s => s.trim()).filter(Boolean);
  if(terms.length === 0) return [];
  const scored = RECIPES.map(r => {
    const hay = r.ingr.filter(i => !i.startsWith('§')).join(' | ').toLowerCase();
    const matches = terms.filter(t => hay.includes(t)).length;
    return { r, matches };
  }).filter(x => x.matches > 0);
  scored.sort((a, b) => b.matches - a.matches);
  return scored.map(x => ({ ...x.r, _matches: x.matches, _of: terms.length }));
}

function nav(view, extra){
  state.history = [];
  state.view = view;
  state.moreOpen = false;
  Object.assign(state, extra || {});
  window.scrollTo(0,0);
  render();
}
function push(view, extra){
  state.history.push({view:state.view, catId:state.catId, recipeId:state.recipeId, query:state.query, filters:{...state.filters}, customTitle:state.customTitle, customIds:state.customIds});
  state.view = view;
  state.moreOpen = false;
  Object.assign(state, extra || {});
  window.scrollTo(0,0);
  render();
}

// ============ RENDER DISPATCH ============
function render(){
  if(!state.ready){
    document.getElementById('app').innerHTML = `<div class="empty" style="padding-top:120px;"><div class="ic">🍽️</div><p>Carregando…</p></div>`;
    return;
  }
  const app = document.getElementById('app');
  let html = renderTopbar();
  if(state.view === 'home') html += renderHome();
  else if(state.view === 'category') html += renderCategoryView(state.catId);
  else if(state.view === 'categories') html += renderCategoriesView();
  else if(state.view === 'search') html += renderSearchView();
  else if(state.view === 'favorites') html += renderFavoritesView();
  else if(state.view === 'bonus') html += renderBonusView();
  else if(state.view === 'recipe') html += renderRecipeView(state.recipeId);
  else if(state.view === 'shopping') html += renderShoppingView();
  else if(state.view === 'haveathome') html += renderHaveAtHomeView();
  else if(state.view === 'progress') html += renderProgressView();
  else if(state.view === 'customlist') html += renderCustomListView();
  app.innerHTML = `<div class="fade-in">${html}</div>`;
  renderBottomNav();
  renderMoreSheet();
  if(state.view === 'search'){
    const inp = document.getElementById('searchInput');
    if(inp){ inp.focus(); inp.addEventListener('input', e => { state.query = e.target.value; renderSearchResultsOnly(); }); }
  }
  if(state.view === 'haveathome'){
    const inp = document.getElementById('haveInput');
    if(inp) inp.addEventListener('input', e => { renderHaveResultsOnly(e.target.value); });
  }
}

// ============ RECIPE DETAIL VIEW ============
function renderRecipeView(id){
  const r = RECIPE_BY_ID[id];
  if(!r) return `<div class="wrap"><div class="empty"><div class="ic">🔍</div><h3>Receita não encontrada</h3></div></div>`;
  const cat = CAT_BY_ID[r.cat];
  const fav = state.favorites.has(r.id);
  const status = state.status[r.id];
  const checkedSet = state.checked[r.id] || new Set();
  const factor = getPortionFactor(r);
  const base = parseYieldBase(r.yield);

  // quick info — only shown when the source data actually has it
  const qis = [];
  if(r.time) qis.push({ic:'⏱', val:r.time, lbl:'Tempo'});
  if(r.temp) qis.push({ic:'🌡', val:r.temp, lbl:'Temperatura'});
  if(r.yield) qis.push({ic:'🍽', val:r.yield, lbl:'Rendimento'});
  qis.push({ic:'⭐', val:r.diff, lbl:'Dificuldade'});

  // content-derived callouts — extracted from the recipe's own text, never invented
  const preheat = extractPreheat(r);
  const flip = extractFlip(r);
  const dica = extractDica(r);
  const atencao = extractAtencao(r);

  const ingrHtml = r.ingr.map((it, idx) => {
    if(it.startsWith('§')) return `<div class="ingr-header">${esc(it.slice(1))}</div>`;
    const checked = checkedSet.has(idx);
    const display = factor !== 1 ? scaleIngredientText(it, factor) : it;
    return `
      <li class="ingr-item ${checked?'checked':''}" tabindex="0" role="checkbox" aria-checked="${checked}" onclick="toggleIngr(${r.id},${idx})" onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault(); toggleIngr(${r.id},${idx});}">
        <span class="ingr-check">${checked?'✓':''}</span>
        <span class="ingr-txt">${esc(display)}</span>
      </li>`;
  }).join('');

  let stepCounter = 0;
  const stepsHtml = r.steps.map((it) => {
    if(it.startsWith('§')) return `<div class="step-header">${esc(it.slice(1))}</div>`;
    stepCounter++;
    return `<li class="step-item"><div class="step-num">${stepCounter}</div><div class="step-txt">${esc(it)}</div></li>`;
  }).join('');

  const inCat = RECIPES.filter(x => x.cat === r.cat);
  const idx = inCat.findIndex(x => x.id === r.id);
  const prevR = inCat[(idx - 1 + inCat.length) % inCat.length];
  const nextR = inCat[(idx + 1) % inCat.length];

  return `
  <div class="wrap">
    <div class="detail-hero" style="background:${catGrad(r.cat)}">
      <div class="hrow">
        <button class="back" aria-label="Voltar" style="background:rgba(255,255,255,0.6); border:none;" onclick="goBack()">←</button>
        <button class="icon-btn ${fav?"on":""}" aria-label="Favoritar" style="background:rgba(255,255,255,0.6); border:none;" onclick="toggleFavorite(${r.id})">${fav?'❤️':'🤍'}</button>
      </div>
      <div class="hemoji">${emojiFor(r)}</div>
      <div style="text-align:center;">
        <div class="num">${cat.emoji} ${cat.name.toUpperCase()} · RECEITA #${String(r.id).padStart(3,'0')}</div>
        <h1 class="serif">${esc(r.title)}</h1>
      </div>
      <div class="detail-tags" style="justify-content:center;">
        <span class="tag-pill">${r.diff}</span>
        ${r.tags.slice(0,3).map(t => `<span class="tag-pill">${esc(t)}</span>`).join('')}
      </div>
      <div class="quickinfo">
        ${qis.map(q => `<div class="qi"><div class="qi-ic">${q.ic}</div><div class="qi-val">${esc(q.val)}</div><div class="qi-lbl">${q.lbl}</div></div>`).join('')}
      </div>
    </div>

    <div class="section" style="margin-top:18px;">
      <div class="status-row">
        <button class="status-btn ${fav?'active-fav':''}" onclick="toggleFavorite(${r.id})"><span class="sb-ic">${fav?'❤️':'🤍'}</span>Favorito</button>
        <button class="status-btn ${status==='done'?'active-done':''}" onclick="setStatus(${r.id},'done')"><span class="sb-ic">✅</span>Já fiz</button>
        <button class="status-btn ${status==='want'?'active-want':''}" onclick="setStatus(${r.id},'want')"><span class="sb-ic">🔖</span>Quero fazer</button>
      </div>
    </div>

    <div class="actions-row">
      <button class="icon-btn" onclick="shareRecipe(${r.id})" title="Compartilhar" aria-label="Compartilhar receita">📤</button>
      <button class="icon-btn" onclick="printRecipe()" title="Imprimir" aria-label="Imprimir receita">🖨️</button>
      <button class="icon-btn" onclick="copyIngredients(${r.id})" title="Copiar ingredientes" aria-label="Copiar lista de ingredientes">📋</button>
      <button class="icon-btn" onclick="addRecipeToShopping(${r.id})" title="Adicionar à lista de compras" aria-label="Adicionar à lista de compras">🛒</button>
    </div>

    <div class="no-print">
      <button class="btn btn-primary btn-block" style="margin:6px 0 4px; padding:16px; font-size:15.5px;" onclick="startCookMode(${r.id})">👨‍🍳 Começar modo cozinha</button>
      ${r.time ? `<button class="btn btn-ghost btn-block" style="margin-bottom:6px;" onclick="openTimerFor(${r.id})">⏱️ Iniciar timer (${esc(r.time)})</button>` : ''}
    </div>

    ${preheat || flip || dica || atencao ? `
    <div class="section">
      ${preheat ? `<div class="callout info"><span class="co-ic">🔥</span><div><b>Pré-aquecimento:</b> ${esc(preheat)}</div></div>` : ''}
      ${flip ? `<div class="callout info"><span class="co-ic">🔄</span><div><b>Quando virar:</b> ${esc(flip)}</div></div>` : ''}
      ${dica ? `<div class="callout tip"><span class="co-ic">💡</span><div><b>Dica:</b> ${esc(dica)}</div></div>` : ''}
      ${atencao ? `<div class="callout warn"><span class="co-ic">⚠️</span><div><b>Atenção:</b> ${esc(atencao)}</div></div>` : ''}
    </div>` : ''}

    ${base ? `
    <div class="portion-row" style="flex-direction:column; align-items:stretch;">
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="portion-label">🍽 Ajustar quantidade (original: ${esc(r.yield)})</span>
        <div class="portion-controls">
          <button onclick="adjustPortion(${r.id},-1)" aria-label="Diminuir">−</button>
          <span class="pval">${state.portions[r.id] || base}</span>
          <button onclick="adjustPortion(${r.id},1)" aria-label="Aumentar">+</button>
        </div>
      </div>
      <div class="portion-chips">
        ${[base, base*2, Math.max(1,Math.round(base/2)), base+2].filter((v,i,a)=>v>0 && a.indexOf(v)===i).sort((a,b)=>a-b).slice(0,4).map(v => `
          <button class="portion-chip ${((state.portions[r.id]||base)===v)?'active':''}" onclick="setPortion(${r.id},${v})">${v}</button>
        `).join('')}
      </div>
    </div>` : ''}

    <div class="section">
      <div class="section-title">🛒 Ingredientes</div>
      <ul class="ingr-list">${ingrHtml}</ul>
    </div>

    <div class="section">
      <div class="section-title">👨‍🍳 Modo de preparo</div>
      <ul class="steps-list">${stepsHtml}</ul>
    </div>

    <div class="prevnext">
      <button class="pn-card" onclick="goRecipe(${prevR.id})"><span class="pn-lbl">← Receita anterior</span><span class="pn-title">${esc(prevR.title)}</span></button>
      <button class="pn-card next" onclick="goRecipe(${nextR.id})"><span class="pn-lbl">Próxima receita →</span><span class="pn-title">${esc(nextR.title)}</span></button>
    </div>
    <div style="text-align:center; padding:6px 0 10px;">
      <button class="btn btn-ghost" onclick="goCategory('${r.cat}')">← Voltar para ${esc(cat.name)}</button>
    </div>
  </div>`;
}

function goBack(){
  if(state.cook.active){ exitCookMode(); return; }
  const h = state.history.pop();
  if(h){ Object.assign(state, h); render(); }
  else goHome();
}

// ============ STATUS / FAVORITES ============
function toggleFavorite(id){
  if(state.favorites.has(id)){ state.favorites.delete(id); toast('Removido dos favoritos'); }
  else { state.favorites.add(id); toast('❤️ Receita adicionada aos favoritos'); }
  persistFavorites();
  render();
}
function setStatus(id, value){
  const cur = state.status[id];
  if(cur === value){ delete state.status[id]; }
  else { state.status[id] = value; }
  persistStatus();
  if(value === 'done' && cur !== 'done') toast('👨‍🍳 Bom apetite! Receita marcada como feita');
  else if(value === 'want' && cur !== 'want') toast('🔖 Adicionada à lista "quero fazer"');
  render();
}
function toggleIngr(recipeId, idx){
  if(!state.checked[recipeId]) state.checked[recipeId] = new Set();
  const s = state.checked[recipeId];
  if(s.has(idx)) s.delete(idx); else s.add(idx);
  render();
}

// ============ PORTION CALCULATOR ACTIONS ============
function setPortion(id, val){
  if(val < 1) val = 1;
  state.portions[id] = val;
  render();
}
function adjustPortion(id, delta){
  const r = RECIPE_BY_ID[id];
  const base = parseYieldBase(r.yield) || 1;
  const cur = state.portions[id] || base;
  setPortion(id, cur + delta);
}

// ============ SHARE / PRINT / COPY ============
function copyIngredients(id){
  const r = RECIPE_BY_ID[id];
  const factor = getPortionFactor(r);
  const lines = r.ingr.map(it => it.startsWith('§') ? `\n${it.slice(1)}:` : `- ${factor!==1?scaleIngredientText(it,factor):it}`);
  const text = `${r.title}\n\n` + lines.join('\n');
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(() => toast('✓ Ingredientes copiados')).catch(() => toast('Não foi possível copiar'));
  } else toast('Não foi possível copiar');
}
function shareRecipe(id){
  const r = RECIPE_BY_ID[id];
  const factor = getPortionFactor(r);
  const ingrLines = r.ingr.filter(i=>!i.startsWith('§')).map(i => '• ' + (factor!==1?scaleIngredientText(i,factor):i));
  const stepLines = r.steps.filter(s=>!s.startsWith('§')).map((s,i) => `${i+1}. ${s}`);
  const parts = [`${r.title} — 200 Receitas Air Fryer`];
  const meta = [r.time && `⏱ ${r.time}`, r.temp && `🌡 ${r.temp}`, r.yield && `🍽 ${r.yield}`].filter(Boolean);
  if(meta.length) parts.push(meta.join(' · '));
  parts.push('\nIngredientes:\n' + ingrLines.join('\n'));
  parts.push('\nModo de preparo:\n' + stepLines.join('\n'));
  const text = parts.join('\n');
  if(navigator.share){
    navigator.share({title:r.title, text}).catch(()=>{});
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(() => toast('✓ Receita pronta para compartilhar'));
  } else toast('✓ Receita pronta para compartilhar');
}
function printRecipe(){ window.print(); }

function addRecipeToShopping(id){
  const r = RECIPE_BY_ID[id];
  const factor = getPortionFactor(r);
  let added = 0;
  r.ingr.filter(i => !i.startsWith('§')).forEach(i => {
    const text = factor !== 1 ? scaleIngredientText(i, factor) : i;
    const exists = state.shopping.some(s => s.text.toLowerCase() === text.toLowerCase() && !s.checked);
    if(!exists){ state.shopping.push({id: 's'+Date.now()+Math.random().toString(36).slice(2,6), text, checked:false, recipeId:id, recipeTitle:r.title}); added++; }
  });
  persistShopping();
  toast(added > 0 ? `🛒 ${added} ingrediente(s) adicionados à lista` : 'Esses ingredientes já estão na lista');
  render();
}


// ============ COOK MODE ============
function getCookSteps(r){
  const out = [];
  let curHeader = null;
  for(const s of r.steps){
    if(s.startsWith('§')){ curHeader = s.slice(1); continue; }
    out.push({header: curHeader, text: s});
  }
  return out;
}

async function startCookMode(recipeId){
  state.cook = { active:true, recipeId, stepIdx:0, wakeLock:null };
  renderCookOverlay();
  document.getElementById('cookOverlay').classList.add('show');
  await requestWakeLock();
}
function exitCookMode(){
  releaseWakeLock();
  state.cook.active = false;
  document.getElementById('cookOverlay').classList.remove('show');
  document.getElementById('cookOverlay').innerHTML = '';
}
function cookNext(){
  const r = RECIPE_BY_ID[state.cook.recipeId];
  const steps = getCookSteps(r);
  if(state.cook.stepIdx < steps.length - 1){ state.cook.stepIdx++; renderCookOverlay(); }
  else { toast('👨\u200d🍳 Bom apetite!'); setStatusQuiet(r.id,'done'); exitCookMode(); render(); }
}
function cookPrev(){
  if(state.cook.stepIdx > 0){ state.cook.stepIdx--; renderCookOverlay(); }
}
function setStatusQuiet(id, value){
  if(state.status[id] !== value){ state.status[id] = value; persistStatus(); }
}

async function requestWakeLock(){
  try{
    if('wakeLock' in navigator){
      state.cook.wakeLock = await navigator.wakeLock.request('screen');
    }
  }catch(e){ /* not supported / denied — cook mode still works, screen may just dim normally */ }
}
function releaseWakeLock(){
  try{ if(state.cook.wakeLock){ state.cook.wakeLock.release(); state.cook.wakeLock = null; } }catch(e){}
}

function renderCookOverlay(){
  const r = RECIPE_BY_ID[state.cook.recipeId];
  const steps = getCookSteps(r);
  const i = state.cook.stepIdx;
  const cur = steps[i];
  const pct = Math.round(((i+1) / steps.length) * 100);
  document.getElementById('cookOverlay').innerHTML = `
    <div class="cook-top">
      <button class="icon-btn" aria-label="Sair do modo cozinha" onclick="exitCookMode()">✕</button>
      <div style="text-align:center;">
        <div style="font-weight:700; font-size:13px;">${esc(r.title)}</div>
      </div>
      <button class="icon-btn" aria-label="Abrir timer" onclick="openTimerFor(${r.id})">⏱️</button>
    </div>
    <div class="cook-progress-track"><div class="cook-progress-fill" style="width:${pct}%"></div></div>
    <div class="cook-body">
      <div class="cook-step-of">PASSO ${i+1} DE ${steps.length}</div>
      ${cur.header ? `<div class="cook-header-tag">${esc(cur.header)}</div>` : ''}
      <div class="cook-step-text">${esc(cur.text)}</div>
    </div>
    <div class="cook-bottom">
      <button class="cook-nav-prev" onclick="cookPrev()" ${i===0?'disabled style="opacity:.4;"':''}>← Anterior</button>
      <button class="cook-nav-next" onclick="cookNext()">${i===steps.length-1?'Concluir 👨\u200d🍳':'Próximo passo →'}</button>
    </div>
  `;
}


// ============ TIMER ============
function openTimerFor(recipeId){
  const r = RECIPE_BY_ID[recipeId];
  if(state.timer.recipeId !== recipeId || !state.timer.total){
    timerPause();
    const mins = r.timeMin || 10;
    state.timer = { total: mins*60, remaining: mins*60, running:false, recipeId, label:r.title, intervalId:null, finished:false, sheetOpen:true };
  } else {
    state.timer.sheetOpen = true;
  }
  renderTimerWidget();
}
function closeTimerSheet(){ state.timer.sheetOpen = false; renderTimerWidget(); }
function timerStart(){
  if(state.timer.running || state.timer.remaining<=0) return;
  state.timer.running = true;
  state.timer.finished = false;
  requestNotifPermission();
  state.timer.intervalId = setInterval(timerTick, 1000);
  renderTimerWidget();
}
function timerPause(){
  state.timer.running = false;
  if(state.timer.intervalId) clearInterval(state.timer.intervalId);
  state.timer.intervalId = null;
  renderTimerWidget();
}
function timerReset(){
  timerPause();
  state.timer.remaining = state.timer.total;
  state.timer.finished = false;
  renderTimerWidget();
}
function timerTick(){
  state.timer.remaining--;
  if(state.timer.remaining <= 0){
    state.timer.remaining = 0;
    timerPause();
    state.timer.finished = true;
    playBeep();
    notifyDone();
  }
  renderTimerWidget();
}
function fmtTime(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function playBeep(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    for(let i=0;i<3;i++){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.001, ctx.currentTime + i*0.4);
      g.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + i*0.4 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.4 + 0.3);
      o.start(ctx.currentTime + i*0.4);
      o.stop(ctx.currentTime + i*0.4 + 0.32);
    }
  }catch(e){ /* audio not available — visual banner still shows */ }
}
function requestNotifPermission(){
  try{ if('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); }catch(e){}
}
function notifyDone(){
  try{
    if('Notification' in window && Notification.permission === 'granted'){
      new Notification('🔔 Tempo finalizado!', { body: state.timer.label, silent:false });
    }
  }catch(e){}
}

function renderTimerWidget(){
  const el = document.getElementById('timerWidget');
  if(!el) return;
  if(!state.timer.total){ el.innerHTML = ''; return; }
  if(!state.timer.sheetOpen){
    el.innerHTML = `
      <button class="timer-fab" onclick="state.timer.sheetOpen=true; renderTimerWidget();" aria-label="Abrir timer">
        <span>${state.timer.finished?'🔔':(state.timer.running?'⏱️':'⏸')}</span> ${fmtTime(state.timer.remaining)}
      </button>`;
    return;
  }
  el.innerHTML = `
    <div class="filter-sheet-backdrop show" onclick="closeTimerSheet()"></div>
    <div class="filter-sheet show">
      <div class="sheet-handle"></div>
      ${state.timer.finished ? `<div class="timer-done-banner">🔔 TEMPO FINALIZADO!</div>` : ''}
      <div class="timer-card" style="border:none; box-shadow:none; padding:4px 0 10px;">
        <div style="font-size:13px; font-weight:700; color:var(--ink-soft);">⏱️ TIMER · ${esc(state.timer.label)}</div>
        <div class="timer-display">${fmtTime(state.timer.remaining)}</div>
        <div class="timer-controls">
          <button class="tc-secondary" onclick="timerReset()" aria-label="Reiniciar">↻</button>
          ${state.timer.running
            ? `<button class="tc-primary" onclick="timerPause()" aria-label="Pausar">⏸</button>`
            : `<button class="tc-primary" onclick="timerStart()" aria-label="Iniciar">▶</button>`}
          <button class="tc-secondary" onclick="closeTimerSheet()" aria-label="Fechar">✕</button>
        </div>
      </div>
    </div>`;
}


// ============ SHOPPING LIST ============
function renderShoppingView(){
  const items = state.shopping;
  const pending = items.filter(i => !i.checked);
  const done = items.filter(i => i.checked);
  return `
  <div class="wrap">
    <div class="subhead"><h1 class="serif">🛒 Minha Lista de Compras</h1></div>
    <div class="shop-add-row">
      <input id="shopInput" placeholder="Adicionar item..." onkeydown="if(event.key==='Enter'){ addShopItemFromInput(); }">
      <button class="btn btn-primary" onclick="addShopItemFromInput()">Adicionar</button>
    </div>
    ${items.length === 0 ? `
      <div class="empty">
        <div class="ic">🛒</div>
        <h3>Sua lista está vazia</h3>
        <p>Adicione itens acima ou toque em "🛒 Adicionar à lista de compras" em qualquer receita.</p>
      </div>` : `
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-bottom:6px;">
        ${done.length>0 ? `<button class="section-link" onclick="clearCheckedShop()">Limpar comprados</button>` : ''}
        <button class="section-link" onclick="clearAllShop()" style="color:var(--tomato);">Limpar tudo</button>
      </div>
      <ul class="ingr-list">
        ${pending.map(i => shopItemHtml(i)).join('')}
        ${done.length ? `<div class="ingr-header" style="color:var(--ink-faint);">JÁ COMPRADOS (${done.length})</div>` : ''}
        ${done.map(i => shopItemHtml(i)).join('')}
      </ul>`}
  </div>`;
}
function shopItemHtml(i){
  return `
    <li class="shop-item ${i.checked?'checked':''}">
      <span class="sh-check" onclick="toggleShopItem('${i.id}')">${i.checked?'✓':''}</span>
      <span class="sh-txt" onclick="toggleShopItem('${i.id}')">${esc(i.text)}${i.recipeTitle?`<div class="sh-src">${esc(i.recipeTitle)}</div>`:''}</span>
      <button class="sh-del" aria-label="Remover item" onclick="removeShopItem('${i.id}')">✕</button>
    </li>`;
}
function addShopItemFromInput(){
  const inp = document.getElementById('shopInput');
  const text = inp.value.trim();
  if(!text) return;
  addShopItem(text);
  inp.value = '';
}
function addShopItem(text){
  state.shopping.push({id:'s'+Date.now()+Math.random().toString(36).slice(2,6), text, checked:false, recipeId:null, recipeTitle:null});
  persistShopping();
  render();
}
function toggleShopItem(id){
  const it = state.shopping.find(i => i.id === id);
  if(it){ it.checked = !it.checked; persistShopping(); render(); }
}
function removeShopItem(id){
  state.shopping = state.shopping.filter(i => i.id !== id);
  persistShopping();
  render();
}
function clearCheckedShop(){
  state.shopping = state.shopping.filter(i => !i.checked);
  persistShopping();
  render();
}
function clearAllShop(){
  state.shopping = [];
  persistShopping();
  render();
}


// ============ PROGRESS / ACHIEVEMENTS ============

const ACHIEVEMENTS = [
  {n:1,   ic:'🥉', lbl:'Primeira receita'},
  {n:5,   ic:'🔥', lbl:'5 receitas'},
  {n:10,  ic:'👨\u200d🍳', lbl:'10 receitas'},

  {n:50,  ic:'💎', lbl:'50 receitas'},
  {n:100, ic:'👑', lbl:'100 receitas'},
  {n:200, ic:'🔥', lbl:'200 receitas'},
];

function renderProgressView(){
  const done = doneCount();
  const pct = Math.min(100, Math.round((done / TOTAL_RECIPES) * 100));
  const wantList = RECIPES.filter(r => state.status[r.id] === 'want');
  const doneList = RECIPES.filter(r => state.status[r.id] === 'done');
  return `
  <div class="wrap">
    <div class="subhead"><h1 class="serif">📊 Meu progresso</h1></div>
    <div class="progress-hero" style="margin-top:16px;">
      <div class="progress-num">${done} <span style="font-size:18px; opacity:.7;">de ${TOTAL_RECIPES} receitas</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div style="font-size:12.5px; color:#D8CBB4; margin-top:4px;">${pct}% da coleção já preparada</div>
    </div>

    <div class="section">
      <div class="section-title">🏅 Conquistas</div>
      <div class="badge-grid">
        ${ACHIEVEMENTS.map(a => `
          <div class="badge ${done>=a.n?'unlocked':''}">
            <span class="bg-ic">${a.ic}</span>
            <span class="bg-lbl">${a.lbl}</span>
          </div>`).join('')}
      </div>
    </div>

    ${wantList.length ? `
    <div class="section">
      <div class="section-title">🔖 Quero fazer (${wantList.length})</div>
      <div class="rc-grid">${wantList.slice(0,8).map(r => recipeCard(r)).join('')}</div>
    </div>` : ''}

    ${doneList.length ? `
    <div class="section">
      <div class="section-title">✅ Já preparadas</div>
      <div class="rc-grid">${doneList.slice(0,8).map(r => recipeCard(r)).join('')}</div>
    </div>` : `
    <div class="empty">
      <div class="ic">👨\u200d🍳</div>
      <h3>Você ainda não marcou nenhuma receita como feita</h3>
      <p>Abra uma receita e toque em "Já fiz" depois de prepará-la.</p>
    </div>`}
  </div>`;
}

  <div class="wrap">

      <button class="back" aria-label="Voltar" onclick="goBack()">←</button>
      <h1 class="serif">🥕 O que você tem em casa?</h1>

function renderHaveResultsOnly(text){
  const el = document.getElementById('haveResults');
  if(!text || !text.trim()){
    el.innerHTML = `<div class="empty"><div class="ic">🥘</div><h3>Digite alguns ingredientes</h3><p>Vamos priorizar as receitas com mais correspondências.</p></div>`;
    return;
  }
  const results = matchByIngredients(text).slice(0, 24);
  if(results.length === 0){
    el.innerHTML = `<div class="empty"><div class="ic">🔍</div><h3>Não encontramos essa receita</h3><p>Tente outro ingrediente ou combinação.</p></div>`;
    return;
  }
  el.innerHTML = `

    <div class="rc-grid">${results.map(r => recipeCard(r)).join('')}</div>`;
}
