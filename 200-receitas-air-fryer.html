<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FBF6EC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Air Fryer">
<meta name="description" content="200 receitas de air fryer organizadas por categoria, com busca, filtros e favoritos.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232B2420'/%3E%3Ctext x='50' y='64' font-size='54' text-anchor='middle'%3E%F0%9F%8D%97%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%232B2420'/%3E%3Ctext x='50' y='64' font-size='54' text-anchor='middle'%3E%F0%9F%8D%97%3C/text%3E%3C/svg%3E">
<title>200 Receitas Air Fryer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF6EC;
  --paper-deep:#F3EBDB;
  --ink:#2B2420;
  --ink-soft:#71655A;
  --ink-faint:#A79C8E;
  --gold:#C4831E;
  --gold-deep:#A66B15;
  --gold-tint:#F6E4C4;
  --olive:#56683F;
  --olive-tint:#E3E9D6;
  --tomato:#B33F32;
  --tomato-tint:#F4DAD4;
  --card:#FFFFFF;
  --border:rgba(43,36,32,0.10);
  --shadow-sm:0 1px 2px rgba(43,36,32,0.06), 0 1px 1px rgba(43,36,32,0.04);
  --shadow-md:0 8px 24px -8px rgba(43,36,32,0.18), 0 2px 8px -2px rgba(43,36,32,0.08);
  --shadow-lg:0 20px 48px -12px rgba(43,36,32,0.28);
  --radius-sm:12px;
  --radius-md:18px;
  --radius-lg:26px;
  --nav-h:64px;
  --cat-cafe:#D98A2B;
  --cat-cafe-tint:#F7E4C6;
  --cat-almoco:#5F7A3D;
  --cat-almoco-tint:#DEE7CE;
  --cat-janta:#4C5B7A;
  --cat-janta-tint:#DCE1EC;
  --cat-lanches:#BC5B3D;
  --cat-lanches-tint:#F2DCD0;
  --cat-petiscos:#A63A32;
  --cat-petiscos-tint:#F1D6D1;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;}
img,svg{display:block; max-width:100%;}
button{font-family:inherit; cursor:pointer;}
a{color:inherit; text-decoration:none;}
input{font-family:inherit;}
::selection{background:var(--gold-tint); color:var(--ink);}
:focus-visible{outline:2.5px solid var(--gold-deep); outline-offset:2px; border-radius:4px;}
.ingr-item:focus-visible{outline-offset:-2px;}

#app{min-height:100vh; padding-bottom:calc(var(--nav-h) + 24px); position:relative;}
.wrap{max-width:640px; margin:0 auto; padding:0 18px;}
@media(min-width:860px){
  .wrap{max-width:1080px; padding:0 40px;}
}

/* ---------- Topbar ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  background:rgba(251,246,236,0.92);
  backdrop-filter:blur(10px) saturate(140%);
  border-bottom:1px solid var(--border);
}
.topbar-inner{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px; max-width:640px; margin:0 auto;
}
@media(min-width:860px){ .topbar-inner{max-width:1080px; padding:16px 40px;} }
.brand{display:flex; align-items:center; gap:10px; font-family:'Fraunces',serif; font-weight:600; font-size:17px; letter-spacing:-0.01em;}
.brand-mark{
  width:34px; height:34px; border-radius:10px;
  background:linear-gradient(155deg,var(--gold) 0%, var(--gold-deep) 100%);
  display:flex; align-items:center; justify-content:center; font-size:17px;
  box-shadow:var(--shadow-sm);
}
.desktop-nav{display:none; gap:4px;}
@media(min-width:860px){ .desktop-nav{display:flex;} }
.desktop-nav button{
  display:flex; align-items:center; gap:7px;
  padding:9px 16px; border:none; background:transparent; border-radius:99px;
  font-size:14.5px; font-weight:600; color:var(--ink-soft);
  transition:background .15s, color .15s;
}
.desktop-nav button:hover{background:var(--paper-deep); color:var(--ink);}
.desktop-nav button.active{background:var(--ink); color:var(--paper);}

/* ---------- Bottom nav (mobile) ---------- */
.bottom-nav{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  height:var(--nav-h);
  background:rgba(255,253,249,0.94);
  backdrop-filter:blur(14px) saturate(160%);
  border-top:1px solid var(--border);
  display:flex; align-items:stretch; justify-content:space-around;
  padding-bottom:env(safe-area-inset-bottom);
}
@media(min-width:860px){ .bottom-nav{display:none;} }
.nav-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; border:none; background:none; color:var(--ink-faint); font-size:10.5px; font-weight:600;
  position:relative;
}
.nav-btn .ic{font-size:20px; line-height:1; transition:transform .15s;}
.nav-btn.active{color:var(--gold-deep);}
.nav-btn.active .ic{transform:translateY(-1px) scale(1.08);}
.nav-btn .dot{position:absolute; top:2px; right:calc(50% - 15px); width:6px; height:6px; border-radius:50%; background:var(--tomato);}

/* ---------- Search ---------- */
.search-hero{
  position:relative; border-radius:28px; padding:26px 22px;
  background:linear-gradient(155deg,#2E2620 0%, #241D18 100%);
  color:#F6EEDF; overflow:hidden; margin:18px 0 22px;
}
.search-hero::before{
  content:''; position:absolute; inset:0; opacity:.5;
  background-image:radial-gradient(circle at 85% 10%, rgba(196,131,30,0.35), transparent 45%),
                    radial-gradient(circle at 5% 95%, rgba(86,104,63,0.35), transparent 50%);
}
.search-hero-inner{position:relative;}
.search-eyebrow{font-size:12.5px; font-weight:600; color:#D8B27E; letter-spacing:.02em; margin-bottom:6px;}
.search-title{font-family:'Fraunces',serif; font-weight:600; font-size:25px; line-height:1.25; margin:0 0 16px; max-width:22ch;}
.search-box{
  display:flex; align-items:center; gap:10px;
  background:rgba(255,253,249,0.98); border-radius:16px; padding:13px 16px;
  box-shadow:var(--shadow-md);
}
.search-box input{
  border:none; outline:none; background:none; flex:1; font-size:15.5px; color:var(--ink);
}
.search-box input::placeholder{color:var(--ink-faint);}
.search-box .ic{font-size:18px; opacity:.6;}
.search-counter{margin-top:14px; font-size:13px; color:#C7B79C; display:flex; align-items:center; gap:6px;}

/* ---------- Section headers ---------- */
.section{margin:30px 0;}
.section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px;}
.section-title{font-family:'Fraunces',serif; font-weight:600; font-size:19.5px; letter-spacing:-0.01em; display:flex; align-items:center; gap:8px;}
.section-link{font-size:13px; font-weight:600; color:var(--gold-deep); white-space:nowrap;}
.hscroll{display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x proximity; padding:2px 2px 10px; margin:0 -2px; -webkit-overflow-scrolling:touch;}
.hscroll::-webkit-scrollbar{display:none;}
.hscroll > *{scroll-snap-align:start; flex-shrink:0;}

/* ---------- Category cards ---------- */
.cat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
@media(min-width:860px){ .cat-grid{grid-template-columns:repeat(5,1fr);} }
.cat-card{
  background:var(--card); border-radius:var(--radius-md); padding:18px 16px;
  border:1px solid var(--border); box-shadow:var(--shadow-sm);
  display:flex; flex-direction:column; gap:10px; text-align:left;
  transition:transform .15s, box-shadow .15s;
}
.cat-card:active{transform:scale(0.97);}
.cat-card .cat-ic{
  width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:21px;
}
.cat-card .cat-name{font-weight:700; font-size:15px;}
.cat-card .cat-count{font-size:12.5px; color:var(--ink-soft);}

/* ---------- Mood cards ---------- */
.mood-card{
  min-width:168px; background:var(--card); border-radius:var(--radius-md); padding:16px;
  border:1px solid var(--border); box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:8px;
}
.mood-card .mood-ic{font-size:24px;}
.mood-card .mood-label{font-weight:700; font-size:14px; line-height:1.3;}

/* ---------- Recipe cards ---------- */
.rc{
  background:var(--card); border-radius:var(--radius-md); overflow:hidden;
  border:1px solid var(--border); box-shadow:var(--shadow-sm); position:relative;
  display:flex; flex-direction:column; transition:transform .15s, box-shadow .15s;
}
.rc:active{transform:scale(0.98);}
.rc .rc-img{
  aspect-ratio:4/3; position:relative; display:flex; align-items:center; justify-content:center;
  font-size:38px; overflow:hidden;
}
.rc .rc-img::after{content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,0.18) 100%);}
.rc .rc-fav{
  position:absolute; top:9px; right:9px; z-index:2; width:30px; height:30px; border-radius:50%;
  background:rgba(255,255,255,0.9); backdrop-filter:blur(4px); border:none; font-size:14px;
  display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-sm);
}
.rc .rc-body{padding:12px 13px 14px; display:flex; flex-direction:column; gap:6px; flex:1;}
.rc .rc-title{font-weight:700; font-size:14.5px; line-height:1.3; letter-spacing:-0.005em;}
.rc .rc-meta{display:flex; gap:8px; font-size:11.5px; color:var(--ink-soft); flex-wrap:wrap;}
.rc .rc-meta span{display:flex; align-items:center; gap:3px;}

.rc-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:13px;}
@media(min-width:640px){ .rc-grid{grid-template-columns:repeat(3,1fr);} }
@media(min-width:860px){ .rc-grid{grid-template-columns:repeat(4,1fr);} }
.rc-wide{width:158px;}

/* ---------- Chips / filters ---------- */
.chip-row{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 6px; -webkit-overflow-scrolling:touch;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0; padding:9px 15px; border-radius:99px; border:1px solid var(--border); background:var(--card);
  font-size:13.5px; font-weight:600; color:var(--ink-soft); white-space:nowrap; display:flex; align-items:center; gap:6px;
  transition:background .15s, color .15s, border-color .15s;
}
.chip.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}
.chip:active{transform:scale(0.96);}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:13px 20px; border-radius:14px; border:none; font-weight:700; font-size:14.5px;
  transition:transform .1s, opacity .15s;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--ink); color:var(--paper);}
.btn-ghost{background:var(--card); color:var(--ink); border:1px solid var(--border);}
.btn-block{width:100%;}
.icon-btn{
  width:44px; height:44px; border-radius:13px; border:1px solid var(--border); background:var(--card);
  display:flex; align-items:center; justify-content:center; font-size:17px; color:var(--ink);
}
.icon-btn:active{transform:scale(0.94);}
.icon-btn.on{background:var(--tomato-tint); border-color:transparent; color:var(--tomato);}

/* ---------- Back header ---------- */
.subhead{display:flex; align-items:center; gap:12px; padding:16px 0 4px;}
.subhead .back{
  width:38px; height:38px; border-radius:11px; background:var(--card); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;
}
.subhead h1{font-size:19px; margin:0;}

/* ---------- Empty states ---------- */
.empty{text-align:center; padding:60px 20px; color:var(--ink-soft);}
.empty .ic{font-size:40px; margin-bottom:14px;}
.empty h3{font-family:'Fraunces',serif; font-size:18px; color:var(--ink); margin:0 0 6px;}
.empty p{font-size:14px; margin:0; line-height:1.5;}

/* ---------- Recipe detail ---------- */
.detail-hero{
  border-radius:0 0 32px 32px; padding:20px 18px 26px; margin:0 -18px 0;
  display:flex; flex-direction:column; gap:14px; position:relative; overflow:hidden;
}
@media(min-width:860px){ .detail-hero{border-radius:24px; margin:0 0 24px;} }
.detail-hero .hrow{display:flex; align-items:center; justify-content:space-between; position:relative; z-index:2;}
.detail-hero .hemoji{font-size:64px; text-align:center; margin:6px 0 4px; position:relative; z-index:2; filter:drop-shadow(0 6px 14px rgba(0,0,0,0.15));}
.detail-hero .num{font-size:12.5px; font-weight:700; color:rgba(43,36,32,0.55); letter-spacing:.03em;}
.detail-hero h1{font-size:24px; line-height:1.2; margin:2px 0 0; position:relative; z-index:2;}
.detail-tags{display:flex; gap:6px; flex-wrap:wrap; position:relative; z-index:2;}
.tag-pill{padding:5px 11px; border-radius:99px; background:rgba(255,255,255,0.55); font-size:11.5px; font-weight:700; color:var(--ink);}
.quickinfo{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:26px;}
.qi{background:var(--card); border-radius:14px; padding:11px 6px; text-align:center; border:1px solid var(--border);}
.qi .qi-ic{font-size:17px;}
.qi .qi-val{font-weight:700; font-size:12.5px; margin-top:3px;}
.qi .qi-lbl{font-size:10px; color:var(--ink-soft); margin-top:1px;}

.actions-row{display:flex; gap:9px; margin:18px 0 4px;}

.ingr-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px;}
.ingr-item{display:flex; align-items:flex-start; gap:12px; padding:12px 4px; border-bottom:1px dashed var(--border); font-size:14.5px; line-height:1.4;}
.ingr-item:last-child{border-bottom:none;}
.ingr-check{
  width:21px; height:21px; border-radius:7px; border:2px solid var(--ink-faint); flex-shrink:0; margin-top:1px;
  display:flex; align-items:center; justify-content:center; font-size:12px; transition:background .12s, border-color .12s;
}
.ingr-item.checked .ingr-check{background:var(--olive); border-color:var(--olive); color:#fff;}
.ingr-item.checked .ingr-txt{color:var(--ink-faint); text-decoration:line-through;}
.ingr-header{font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--gold-deep); padding:14px 4px 4px;}

.steps-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px;}
.step-item{display:flex; gap:14px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:15px;}
.step-num{
  width:28px; height:28px; border-radius:9px; background:var(--ink); color:var(--paper); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; font-family:'Fraunces',serif;
}
.step-txt{font-size:14.5px; line-height:1.55; padding-top:3px;}
.step-header{font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--gold-deep); padding:10px 2px 0;}

.prevnext{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:28px 0 8px;}
.pn-card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:13px 14px; display:flex; flex-direction:column; gap:4px;}
.pn-lbl{font-size:11px; color:var(--ink-soft); font-weight:600;}
.pn-title{font-size:13.5px; font-weight:700; line-height:1.3;}
.pn-card.next{text-align:right;}

.toast{
  position:fixed; left:50%; bottom:calc(var(--nav-h) + 18px); transform:translateX(-50%) translateY(8px);
  background:var(--ink); color:var(--paper); padding:12px 20px; border-radius:99px; font-size:13.5px; font-weight:600;
  box-shadow:var(--shadow-lg); z-index:100; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  display:flex; align-items:center; gap:8px; white-space:nowrap;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ---------- Bonus ---------- */
.bonus-hero{background:linear-gradient(155deg,var(--olive) 0%, #3F4C2E 100%); color:#EFF3E7;}
.bonus-card{background:var(--card); border-radius:16px; border:1px solid var(--border); padding:16px; display:flex; flex-direction:column; gap:6px; box-shadow:var(--shadow-sm);}
.bonus-card .b-ic{font-size:24px;}
.bonus-card .b-title{font-weight:700; font-size:15px;}
.bonus-card .b-summary{font-size:12.5px; color:var(--ink-soft);}
.bonus-detail{font-size:13.5px; line-height:1.6; color:var(--ink-soft); margin-top:8px; display:none;}
.bonus-card.open .bonus-detail{display:block;}
.bonus-card.open .b-summary{display:none;}

/* ---------- Filter sheet ---------- */
.filter-sheet-backdrop{position:fixed; inset:0; background:rgba(43,36,32,0.4); z-index:60; opacity:0; pointer-events:none; transition:opacity .2s;}
.filter-sheet-backdrop.show{opacity:1; pointer-events:auto;}
.filter-sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:61; background:var(--paper); border-radius:24px 24px 0 0;
  padding:8px 20px 20px; max-height:80vh; overflow-y:auto; transform:translateY(100%); transition:transform .25s ease;
  box-shadow:0 -12px 40px rgba(0,0,0,0.2);
}
.filter-sheet.show{transform:translateY(0);}
.sheet-handle{width:40px; height:4px; background:var(--border); border-radius:99px; margin:8px auto 16px;}
.filter-group{margin-bottom:18px;}
.filter-group h4{font-size:12.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin:0 0 10px;}
.filter-opts{display:flex; gap:8px; flex-wrap:wrap;}

.fade-in{animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

@media print{
  .topbar,.bottom-nav,.actions-row,.prevnext,.toast,.hrow,.rc-fav,.status-row,.no-print,.timer-fab,#fabPrint{display:none !important;}
  body{background:#fff;}
  .detail-hero{background:#fff !important; padding-top:4px; border-radius:0;}
  .qi{border:1px solid #ccc;}
  .search-hero{display:none;}
}

/* ---------- v2.0: enhanced cards ---------- */
.rc-emoji{position:relative; z-index:2; filter:drop-shadow(0 4px 8px rgba(0,0,0,0.12));}
.rc-img-pattern{position:absolute; inset:0; opacity:.5; background-image:radial-gradient(circle at 20% 25%, rgba(255,255,255,0.5), transparent 40%), radial-gradient(circle at 80% 80%, rgba(0,0,0,0.06), transparent 45%);}
.rc-status{position:absolute; top:9px; left:9px; z-index:2; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; box-shadow:var(--shadow-sm);}
.rc-status.done{background:var(--olive); color:#fff;}
.rc-status.want{background:var(--gold-tint); color:var(--gold-deep); font-size:11px;}

/* ---------- v2.0: home shortcut tiles ---------- */
.shortcut-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
@media(min-width:640px){ .shortcut-grid{grid-template-columns:repeat(4,1fr);} }
.shortcut-tile{
  background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px 12px;
  display:flex; flex-direction:column; gap:8px; text-align:left; box-shadow:var(--shadow-sm);
}
.shortcut-tile .st-ic{font-size:21px;}
.shortcut-tile .st-lbl{font-size:12.5px; font-weight:700; line-height:1.25;}
.shortcut-tile:active{transform:scale(0.96);}

/* ---------- v2.0: status segmented control ---------- */
.status-row{display:flex; gap:8px;}
.status-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:11px 6px;
  border-radius:14px; border:1.5px solid var(--border); background:var(--card); font-size:11px; font-weight:700; color:var(--ink-soft);
}
.status-btn .sb-ic{font-size:18px;}
.status-btn.active-fav{border-color:var(--tomato); background:var(--tomato-tint); color:var(--tomato);}
.status-btn.active-done{border-color:var(--olive); background:var(--olive-tint); color:var(--olive);}
.status-btn.active-want{border-color:var(--gold); background:var(--gold-tint); color:var(--gold-deep);}

/* ---------- v2.0: callouts ---------- */
.callout{display:flex; gap:11px; padding:13px 14px; border-radius:14px; margin-bottom:10px; font-size:13.5px; line-height:1.5;}
.callout .co-ic{font-size:17px; flex-shrink:0;}
.callout.tip{background:var(--gold-tint); color:#6B4A0F;}
.callout.warn{background:var(--tomato-tint); color:#7A2E24;}
.callout.info{background:var(--olive-tint); color:#3A4A29;}

/* ---------- v2.0: portion stepper ---------- */
.portion-row{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:12px 14px; margin-bottom:16px;}
.portion-label{font-size:13px; font-weight:700; flex:1;}
.portion-controls{display:flex; align-items:center; gap:10px;}
.portion-controls button{width:32px; height:32px; border-radius:10px; border:1px solid var(--border); background:var(--paper); font-weight:800; font-size:16px; display:flex; align-items:center; justify-content:center;}
.portion-controls .pval{min-width:64px; text-align:center; font-weight:700; font-size:14px;}
.portion-chips{display:flex; gap:6px; margin-top:10px;}
.portion-chip{padding:6px 12px; border-radius:99px; border:1px solid var(--border); background:var(--paper); font-size:12.5px; font-weight:700;}
.portion-chip.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}

/* ---------- v2.0: cook mode ---------- */
#cookOverlay.show{position:fixed; inset:0; z-index:200; background:var(--paper); display:flex; flex-direction:column;}
.cook-top{display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--border);}
.cook-progress-track{height:6px; background:var(--border); border-radius:99px; overflow:hidden; margin:0 18px;}
.cook-progress-fill{height:100%; background:var(--gold); border-radius:99px; transition:width .25s;}
.cook-body{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px 26px; text-align:center; overflow-y:auto;}
.cook-step-of{font-size:13px; font-weight:700; color:var(--gold-deep); letter-spacing:.03em; margin-bottom:14px;}
.cook-step-text{font-family:'Fraunces',serif; font-size:26px; line-height:1.4; font-weight:500; max-width:32ch;}
.cook-header-tag{font-size:12px; font-weight:700; text-transform:uppercase; color:var(--ink-soft); margin-bottom:10px; letter-spacing:.04em;}
.cook-bottom{display:flex; gap:10px; padding:18px; border-top:1px solid var(--border);}
.cook-bottom button{flex:1; padding:16px; border-radius:16px; font-size:15px; font-weight:700; border:none;}
.cook-nav-prev{background:var(--card); color:var(--ink); border:1px solid var(--border) !important;}
.cook-nav-next{background:var(--ink); color:var(--paper);}
.wake-toggle{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft); font-weight:600;}

/* ---------- v2.0: timer ---------- */
.timer-fab{
  position:fixed; right:16px; bottom:calc(var(--nav-h) + 16px); z-index:80; background:var(--ink); color:var(--paper);
  border-radius:99px; padding:12px 18px; display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px;
  box-shadow:var(--shadow-lg); border:none;
}
@media(min-width:860px){ .timer-fab{bottom:24px;} }
.timer-card{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:18px; text-align:center; margin-bottom:16px;}
.timer-display{font-family:'Fraunces',serif; font-size:44px; font-weight:600; letter-spacing:-0.02em; margin:6px 0 14px; font-variant-numeric:tabular-nums;}
.timer-controls{display:flex; gap:10px; justify-content:center;}
.timer-controls button{width:52px; height:52px; border-radius:50%; border:none; font-size:19px; display:flex; align-items:center; justify-content:center;}
.timer-controls .tc-primary{background:var(--ink); color:var(--paper);}
.timer-controls .tc-secondary{background:var(--paper-deep); color:var(--ink);}
.timer-done-banner{background:var(--olive); color:#fff; border-radius:14px; padding:14px; text-align:center; font-weight:700; margin-bottom:16px; animation:pulseGlow 1.4s ease-in-out infinite;}
@keyframes pulseGlow{0%,100%{opacity:1;} 50%{opacity:.75;}}

/* ---------- v2.0: shopping list ---------- */
.shop-item{display:flex; align-items:center; gap:12px; padding:13px 4px; border-bottom:1px dashed var(--border);}
.shop-item .sh-check{width:22px; height:22px; border-radius:7px; border:2px solid var(--ink-faint); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px;}
.shop-item.checked .sh-check{background:var(--olive); border-color:var(--olive); color:#fff;}
.shop-item.checked .sh-txt{color:var(--ink-faint); text-decoration:line-through;}
.shop-item .sh-txt{flex:1; font-size:14.5px;}
.shop-item .sh-src{font-size:11px; color:var(--ink-faint);}
.shop-item .sh-del{width:28px; height:28px; border:none; background:none; color:var(--ink-faint); font-size:16px;}
.shop-add-row{display:flex; gap:8px; margin:14px 0;}
.shop-add-row input{flex:1; border:1px solid var(--border); border-radius:12px; padding:11px 14px; font-size:14px; background:var(--card);}

/* ---------- v2.0: progress ---------- */
.progress-hero{background:linear-gradient(155deg,#2E2620,#241D18); color:#F6EEDF; border-radius:24px; padding:24px 20px; text-align:center; margin-bottom:20px;}
.progress-num{font-family:'Fraunces',serif; font-size:38px; font-weight:600;}
.progress-track{height:10px; background:rgba(255,255,255,0.15); border-radius:99px; overflow:hidden; margin:14px 0 4px;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--gold),#E8B25C); border-radius:99px; transition:width .4s;}
.badge-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
@media(min-width:640px){ .badge-grid{grid-template-columns:repeat(7,1fr);} }
.badge{display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 4px; border-radius:14px; background:var(--card); border:1px solid var(--border); opacity:.35;}
.badge.unlocked{opacity:1; box-shadow:var(--shadow-sm);}
.badge .bg-ic{font-size:24px;}
.badge .bg-lbl{font-size:9.5px; font-weight:700; text-align:center; line-height:1.2;}
</style>

<script>
const APPDATA = {"categories":[{"id":"cafe","name":"Café da Manhã","emoji":"☀️"},{"id":"almoco","name":"Almoço","emoji":"🍛"},{"id":"janta","name":"Janta","emoji":"🌙"},{"id":"lanches","name":"Lanches","emoji":"🥪"},{"id":"petiscos","name":"Petiscos","emoji":"🍗"}],"recipes":[{"id":1,"title":"Pão De Queijo","cat":"cafe","tags":["Pães","Queijo"],"yield":"30 unidades","temp":"200°C","time":"15 min","timeMin":15,"diff":"Médio","ingr":["1kg de polvilho azedo","1 colher de sopa de sal","½ copo (100ml) de água fervendo","250g de margarina","4 ovos","½ litro de leite","250g de queijo (minas) ralado"],"steps":["Misture o sal com o polvilho em uma vasilha, depois coloque aos poucos a água fervente, sem parar de mexer até despejar toda a água. Junte os ovos, margarina e o leite, quando estiver ficando homogêneo acrescente o queijo ralado e amasse bem a massa com as mãos até ficar uniforme.","Faça bolinhas uniformes e vá colocando em uma assadeira. Leve ao freezer por pelo menos 30 minutos antes de assar.","Pré-aqueça sua Airfryer, programando o tempo para 5 minutos e a temperatura para 200 graus.","Após o tempo de pré-aquecimento, coloque os pães de queijo no cesto da Airfryer e programe o tempo para 15 minutos. Caso seja necessário, acerte o tempo para mais ou menos."],"origin":"source"},{"id":2,"title":"Omelete — Versão 1","cat":"cafe","tags":["Ovos"],"yield":"2 porções","temp":"200°C","time":"15 min","timeMin":15,"diff":"Médio","ingr":["2 ovos","2 fatias de presunto picadas","2 fatias de muçarela picadas","1 colher (sopa) de cebola bem picada","½ xícara (chá) de salsinha e cebolinha bem picadas","sal, pimenta-do-reino e orégano a gosto","azeite para untar"],"steps":["Pré-aqueça a Airfryer programando o tempo para 5 minutos e a temperatura para 200 graus.","Utilize um recipiente refratário que caiba na cesta da Airfryer e que tenha borda alta. Pincele azeite e reserve.","Em uma tigela, bata ligeiramente os ovos com um garfo. Acrescente os recheios e temperos. Coloque o recipiente refratário dentro da cesta da Airfryer e despeje os ovos batidos com cuidado para não cair para fora.","Após o tempo de pré-aquecimento, acerte o tempo para 15 minutos. Sua omelete estará pronta quando estiver dourada."],"origin":"source"},{"id":3,"title":"Misto Quente","cat":"cafe","tags":["Queijo","Salgados"],"yield":"2 porções","temp":"200°C","time":"5 min","timeMin":5,"diff":"Médio","ingr":["4 fatias de pão de fôrma sem casca","4 fatias de peito de peru","4 fatias de queijo tipo prato","2 colheres (sopa) de cream cheese","2 colheres de (sopa) de manteiga"],"steps":["Pré-aqueça a Airfryer programando o tempo para 5 minutos e a temperatura para 200 graus.","Passe a manteiga de um lado e cream cheese do outro lado de cada fatia de pão.","Monte os sanduíches colocando duas fatias de peito de peru e duas fatias de queijo entre os pães, com o cream cheese para dentro (o lado com manteiga deve ficar para fora).","Coloque os sanduíches na Airfryer, programe o tempo para 5 minutos e aperte o botão “ligar”."],"origin":"source"},{"id":4,"title":"Pão De Aveia","cat":"cafe","tags":["Pães"],"yield":"3 pães","temp":"160°C","time":"15 min","timeMin":15,"diff":"Mais Elaborado","ingr":["1 e ¼ de xícara (chá) de leite morno","¼ de xícara de (chá) de azeite (ou óleo)","1 envelope de fermento biológico seco","¼ de xícara (chá) de açúcar","2 ovos","1 e ½ xícara (chá) de farinha de trigo","1 e ½ xícara (chá) de farelo de aveia","1 colher (chá) de sal"],"steps":["Reúna todos os ingredientes;","Em um recipiente, adicione o leite, o azeite, o fermento, o açúcar, os ovos e misture bem;","Coloque a farinha, a aveia, o sal e misture até ficar uma massa mole;","Escolha uma forma que caiba na Airfryer, unte com manteiga, polvilhe com farinha e despeje a massa;","Coloque na Airfryer e deixe assar por cerca de 10 minutos a 80 graus;","Aumente a temperatura para 160 graus e deixe mais 15 minutos;","Agora é só servir."],"origin":"source"},{"id":5,"title":"Pão De Milho","cat":"cafe","tags":["Pães"],"yield":"1 pão","temp":"200°C","time":"30 a 40 min","timeMin":40,"diff":"Médio","ingr":["1 xícara de farinha de milho","1 xícara de água fervente","1 xícara de leite","1 colher de (sopa) de azeite","1 ovo","1 colher (sobremesa) de sal","2 colheres de açúcar","2 xícaras de farinha de trigo","1 colher (sopa) de fermento biológico"],"steps":["Umedeça a farinha de milho com a água fervente. Junte o sal, açúcar, o azeite, o leite e misture. Em seguida, adicione o ovo, as xícaras de farinha e o fermento.","Bata bem, pode ser com a mão ou com batedeira. Deixe levedar por 30 minutos.","Unte uma forma de pão, e pré-aqueça a fritadeira a 200 graus, por volta de 10 minutos. Após, disponha a forma na Airfryer e asse por volta de 30 a 40 minutos."],"origin":"source"},{"id":6,"title":"Bolinho De Chuva — Versão 1","cat":"lanches","tags":["Doces"],"yield":"30 unidades","temp":"200°C","time":"6 min","timeMin":6,"diff":"Médio","ingr":["1 xícara de leite","1 ovo","½ xícara de açúcar","1 pitada de sal","2 colheres (sopa) de margarina derretida","2 xícaras e ½ de farinha de trigo","1 colher (sopa) de fermento químico"],"steps":["Em uma vasilha, misture todos os ingredientes e mexa até que fique uma massa homogênea.","Enquanto isso, deixe a Airfryer pré-aquecendo à 200 graus por 5 minutos","Depois, com duas colheres, modele um pouquinho da massa, criando uma bolinha","Coloque as bolinhas na cesta da Airfryer, deixando um dedo de espaço entre elas para não grudarem, e programe a máquina a 200 graus por 6 minutos.","Os bolinhos ficarão com a superfície dourada, retire- os com cuidado e reserve. Para finalizar: Se for de sua preferência, misture açúcar e canela em pó em um recipiente separado.. Quando terminar de fazer todos os bolinhos, passe-os na mistura."],"origin":"source"},{"id":7,"title":"Ovos Cocotte","cat":"cafe","tags":["Ovos"],"yield":"1 porção","temp":"200°C","time":"10 min","timeMin":10,"diff":"Médio","ingr":["1 colher (sopa) de azeite","2 colheres (sopa) de ricota","1 colher (sopa) de queijo parmesão","1 fatia de queijo gorgonzola","1 fatia de queijo brie","1 colher (sopa) de creme de leite","1 ovo","noz-moscada e sal a gosto"],"steps":["Pincele o azeite no fundo de um potinho ou refratário de vidro. Coloque os queijos no fundo e tempere com a noz-moscada e o sal. Adicione o creme de leite.","Quebre o ovo em uma xícara e acrescente-o delicadamente sobre a mistura no refratário.","Pré-aqueça a Airfryer por 5 minutos na temperatura de 200 graus. Ao final do tempo, coloque o refratário dentro da cesta da fritadeira, programe o tempo para 10 minutos e aperte o botão “ligar”."],"origin":"source"},{"id":8,"title":"Cestinha De Presunto E Ovos","cat":"cafe","tags":["Ovos"],"yield":"6 porções","temp":"180°C","time":"5 a 8 min","timeMin":8,"diff":"Fácil","ingr":["6 fatias de presunto ou peito de peru","6 ovos","sal a gosto","forminhas"],"steps":["Unte as forminhas com um pouco de azeite e coloque uma fatia de presunto ou peito de peru forrando o fundo e laterais, formando uma cestinha.","Quebre um ovo dentro de cada forminha, tempere com sal e pimenta e leve para a Airfryer já pré- aquecida na temperatura de 180ºC por cerca de 5 a 8 minutos."],"origin":"source"},{"id":9,"title":"Pão Na Chapa","cat":"cafe","tags":["Pães"],"yield":"4 porções","temp":"200°C","time":"4 min","timeMin":4,"diff":"Fácil","ingr":["2 pães tipo francês","4 colheres de requeijão cremosa","4 fatias de queijo de sua preferência","orégano para finalizar"],"steps":["Corte os pães ao meio e passe requeijão em cada parte, depois coloque as fatias de queijo por cima.","Leve para a Airfryer já pré-aquecida em 200 graus por 4 minutos, ou até o queijo derreter e gratinar."],"origin":"source"},{"id":10,"title":"Pão De Alho","cat":"lanches","tags":["Pães","Salgados"],"yield":"4 a 5 porções","temp":"200°C","time":"10 min","timeMin":10,"diff":"Médio","ingr":["2 pãezinhos franceses amanhecidos","4 colheres (sopa) de alho triturado ou amassado","1 xícara (chá) de maionese","queijo parmesão ralado para polvilhar","1 colher (sopa) de azeite"],"steps":["Pré-aqueça a Airfryer programando o tempo para 5 minutos e a temperatura para 200 graus.","Misture a maionese com alho e reserve.","Corte os pãezinhos em fatias, mas sem separá- las por completo. Distribua o recheio nas cavidades por igual. Pincele com o azeite e polvilhe com queijo ralado.","Após o tempo de pré-aquecimento, acerte o tempo para 10 minutos e aperte o botão “ligar”."],"origin":"source"},{"id":11,"title":"Queijo Coalho A Milanesa","cat":"lanches","tags":["Queijo"],"yield":"4 a 5 porções","temp":"200°C","time":"10 min","timeMin":10,"diff":"Fácil","ingr":["1 pacote de 400g de queijo tipo coalho","3 ovos inteiros","300g de farinha de trigo misturada com 1 colher (sopa) bem cheia de amido de milho","300g de farinha de rosca torrada"],"steps":["Coloque a farinha de rosca em uma panela ou frigideira antiaderente em fogo médio e vá mexendo o tempo todo até ela adquirir uma coloração dourada, levemente tostada.","Corte o queijo em cubinhos. Passe os cubinhos nos ovos, ligeiramente batidos, depois na mistura de farinha de trigo com amido de milho, novamente nos ovos e por último na farinha de rosca. Espalhe os quadradinhos já empanados sobre uma assadeira e leve ao freezer/congelador por cerca de duas horas.","Pré-aqueça a Airfryer por 5 minutos na temperatura de 200 graus. Ao final do tempo, coloque os cubinhos dentro da cesta da fritadeira, programe o tempo para 10 minutos e aperte o botão “ligar”. Agite a cesta na metade do tempo para ficarem dourados por igual."],"origin":"source"},{"id":12,"title":"Folhado De Atum","cat":"lanches","tags":["Peixe","Salgados"],"yield":"2 porções","temp":"200°C","time":"10 min","timeMin":10,"diff":"Médio","ingr":["2 quadrados de massa folhada comprada pronta","1 ovo (clara e gema separadas)","½ xícara (chá) de atum","½ xícara (chá) de cheiro verde picado","½ xícara (chá) de azeitonas picadas","sal e pimenta do reino a gosto"],"steps":["Pré-aqueça a Airfryer por 5 minutos na temperatura de 200 graus.","Misture o atum com as azeitonas e o cheiro verde. Tempere a gosto e reserve.","Coloque metade do recheio sobre cada quadrado de massa e dobre ao meio. Pincele a borda com a clara do ovo e feche delicadamente sem amassar demais para não atrapalhar o crescimento da massa folhada.","Depois de fechado faça dois pequenos cortes na parte superior para saída de ar. Pincele com a gema do ovo.","Coloque na cesta da Airfryer. Programe o tempo para 10 minutos e aperte o botão \"ligar''."],"origin":"source"},{"id":13,"title":"Pan Pizza Pepperoni","cat":"lanches","tags":["Carne","Queijo"],"yield":"5 porções","temp":"200°C","time":"5 a 10 min","timeMin":10,"diff":"Mais Elaborado","ingr":["2 xícaras (chá) de água morna","50g de fermento biológico fresco","4 colheres (sopa) de óleo","1 colher (chá) de sal","5 e ½ xícaras (chá) de farinha de trigo","óleo ou azeite para untar e manteiga ou margarina","para pincelar nas bordas","100g de salame tipo pepperoni fatiado","200g de muçarela ralada","3 tomates grandes","1 colher (sopa) de orégano","sal e pimenta do reino a gosto"],"steps":["Misture todos os ingredientes da massa (água morna, fermento, óleo, sal e farinha de trigo). Divida a massa em 5 partes e deixe descansar por cerca de 10 minutos sobre uma superfície untada com óleo ou azeite e cubra com um pano.","Passe os tomates por um processador de alimentos, picando-os em pedaços ligeiramente grandes. Tempere com sal, pimenta do reino e orégano. Reserve.","Pré-aqueça a Airfryer por 5 minutos na temperatura de 200 graus.","Abra cada porção de massa com as mãos deixando as laterais mais grossas, fazendo a borda da massa. Coloque a massa na Airfryer, arrume, mas não aperte para que a massa não entre nos espaços abertos da cesta. Acerte o tempo para 10 minutos e a temperatura para 180 graus.","Depois de passado esse tempo, despeje um pouco de molho de tomate no centro da massa e espalhe para as bordas. Coloque a muçarela e por cima as fatias de pepperoni. Pincele manteiga ou margarina na borda da pizza. Programe o tempo mais 5 a 10 minutos para 200 graus e aperte o botão \"ligar'', até que as bordas comecem a dourar."],"origin":"source"},{"id":14,"title":"Brusqueta","cat":"lanches","tags":["Salgados"],"yield":"2 porções","temp":"180°C","time":"5 min","timeMin":5,"diff":"Médio","ingr":["4 fatias de pão italiano","1 xícara (chá) de tomate picado","1 xícara (chá) de mussarela ralada","azeite","orégano, sal e pimenta do reino","4 folhas de manjericão"],"steps":["Pré-aqueça a airfryer por 5 minutos na temperatura de 200 graus.","Regue as fatias de pão italiano com azeite. Divida o tomate picado e a muçarela entre as fatias. Tempere com sal, pimenta do reino e orégano. Espalhe mais um fio de azeite sobre o recheio. Coloque uma folha de manjericão em cima de cada fatia.","Espalhe as brusquetas na cesta da Airfryer cuidadosamente. Programe o tempo para 5 minutos, acerte a temperatura para 180 graus e aperte o botão ligar.","Quando prontas, transfira as brusquetas para um refratário e sirva."],"origin":"source"},{"id":15,"title":"Mini Kibe Recheado","cat":"petiscos","tags":["Carne","Salgados"],"yield":"35 unidades","temp":"200°C","time":"15 min","timeMin":15,"diff":"Mais Elaborado","ingr":["250g de trigo para quibe","250g de carne moída (passada duas vezes)","500ml de água fervendo","1 e ½ colher (sopa) de farinha de trigo","½ cebola ralada ou triturada","1 colher (sopa) de azeite","1 dente de alho amassado ou triturado","1 pitada de pimenta do reino ou branca","2 colheres (sopa) de cheiro verde bem picado","300g de provolone cortado em quadradinhos"],"steps":["Coloque o trigo para quibe em uma tigela funda e junte a água quente. Deixe descansar por uns 20 minutos, depois escorra o excesso de água o máximo possível. Coloque novamente na tigela.","Pré-aqueça a Airfryer por 5 minutos na temperatura de 200 graus.","Acrescente todos os outros ingredientes, menos os cubos de provolone, e misture bem com as mãos até ficar uma massa homogênea. Formate bolinhos no formato de quibe colocando um cubo de provolone no centro de cada um e reserve.","Coloque metade dos kibes na cesta da Airfryer, programe o tempo para 15 minutos e aperte o botão “ligar”. Transfira para uma travessa ou bandeja e prepare o restante dos kibes."],"origin":"source"},{"id":16,"title":"Empadinha De Liquidificador","cat":"lanches","tags":["Salgados"],"yield":"12 unidades","temp":"200°C","time":"10 min","timeMin":10,"diff":"Médio","ingr":["½ xícara (chá) de leite","½ xícara (chá) de óleo","¾ xícara (chá) de farinha de trigo","1 colher (sopa) de fermento químico em pó","sal a gosto","1 xícara (chá) de salsichas cortadas em rodelas com","cerca de 1cm","½ xícara (chá) de azeitonas pretas em fatias","queijo ralado para polvilhar"],"steps":["Pré-aqueça a Airfryer por 5 minutos na temperatura de 200 graus.","Bata todos os ingredientes no liquidificador até ficar bem homogêneo. Encha ⅓ de cada forminha de silicone ou alumínio com a massa. Recheie com 2 ou 3 pedaços de salsicha e com pedaços de azeitona. Cubra com mais uma porção da massa. Polvilhe com queijo ralado.","Coloque 6 forminhas na cesta da fritadeira. Programe o tempo para 10 minutos e aperte o botão “ligar”. Na metade do tempo verifique para acompanhar se já estão com a superfície dourada e bem assadas por dentro. Se necessário ajuste o tempo de preparo."],"origin":"source"},{"id":17,"title":"Coxinha De Frango","cat":"lanches","tags":["Frango","Salgados"],"yield":"35 a 40 unidades","temp":"200°C","time":"20 min","timeMin":20,"diff":"Mais Elaborado","ingr":["1 litro de água","150g de manteiga","1 colher (sopa) de sal ou 2 cubinhos de caldo de galinha","esfarelados","½ quilo de peito de frango cozido e desfiado","1 colher (sopa) de tempero pronto de sua preferência","1 pitada de sal","1 colher (sopa) de salsinha picada","1 ovo","½ litro de leite","1 quilo de farinha de rosca torrada"],"steps":["Coloque a água em uma panela e adicione a manteiga e o sal. Leve ao fogo e esquente até que a manteiga esteja completamente derretida.","Acrescente a farinha e com um batedor até obter uma massa lisa mas consistente. É importante manter sempre o fogo médio durante o preparo para cozinhar bem a massa. Deixe a massa descansar por pelo menos trinta minutos em uma superfície lisa.","Coloque o azeite numa frigideira e leve o alho para dourar. Adicione o frango e vá acrescentando os temperos. Modele as coxinhas colocando uma quantidade de massa suficiente para encher a mão.","Amasse um pouco para que ela fique homogênea. Abra um círculo na palma da mão e coloque uma colher de sobremesa de recheio no meio da massa e dê forma à coxinha.","Empane duas vezes: passe na farinha de trigo, na mistura de leite e ovos e na farinha de rosca. Repita. Deixe na geladeira pelo menos uma hora.","Pré-aqueça a Airfryer por 5 minutos na temperatura de 200 graus.","Coloque as coxinhas na cesta da fritadeira formando só uma camada. Programe o tempo para 20 minutos e aperte o botão “ligar”. Agite a cesta delicadamente na metade do tempo para ficarem coradas por igual."],"origin":"source"},{"id":18,"title":"Trouxinha De Cream Cheese E Peru","cat":"petiscos","tags":["Queijo","Salgados"],"yield":"45 unidades","temp":"180°C","time":"5 min","timeMin":5,"diff":"Mais Elaborado","ingr":["1 xícara de leite","1 ovo","⅓ de xícara de água","¼ de xícara de óleo ou azeite","1 e ¾ de colher (chá) de sal","2 colheres (sopa) de açúcar","2 e ½ colheres (chá) de fermento biológico","4 xícaras de farinha de trigo","1 gema de ovo (para pincelar)","2 potes de cream cheese","15 fatias de peito de peru cortadas em 4"],"steps":["Misture todos os ingredientes da massa com as mãos. Depois, faça bolinhas pequenas e coloque sobre uma superfície enfarinhada.","Abra cada bolinha com um rolo tentando deixá-la quadrada. Corte quadrados e recheie colocando um pedaço de peito de peru e 1 colher (café) de cream cheese. Feche unindo as 4 pontas do quadrado de massa formando uma trouxinha. Pincele com gema.","Pré-aqueça a Airfryer por 5 minutos na temperatura de 200 graus. Depois, coloque quantas unidades couberem na fritadeira e asse por 5 minutos a 180 graus."],"origin":"source"},{"id":19,"title":"Dadinhos De Tapioca","cat":"petiscos","tags":["Queijo","Salgados"],"yield":"4 porções","temp":"180°C","time":"40 min","timeMin":40,"diff":"Médio","ingr":["250g de queijo coalho","250g de tapioca granulada","500ml de leite fervente","sal e pimenta","orégano, ou o tempero de sua preferência"],"steps":["Prepare uma forma de 20x25cm forrada com filme plástico.","Rale o queijo no ralo grosso e coloque-o em uma vasilha. Adicione a tapioca, coloque uma pitada de sal, um pouquinho de pimenta, orégano e misture.","Adicione o leite fervente e vá mexendo até incorporar o leite e a massa ficar homogênea. Espalhe a mistura na forma preparada, alise para ficar retinha e leve para a geladeira por no mínimo 3 horas.","Após esse tempo, tire da geladeira, corte em quadradinhos e acomode os cubinhos em uma assadeira antiaderente ou forrada com papel manteiga.","Leve para assar por 40 minutos a 180 graus, até que fiquem douradinhos."],"origin":"source"},{"id":20,"title":"Bolinho De Arroz","cat":"lanches","tags":["Salgados"],"yield":"4 porções","temp":"190°C","time":"10 min","timeMin":10,"diff":"Médio","ingr":["1 xícara (chá) de arroz cozido (já temperado)","3 colheres (sopa) de farinha de trigo","1 colher (sopa) de salsinha picada","2 colheres de queijo ralado","1 ovo","sal e pimenta a gosto","azeite"],"steps":["Reúna todos os ingredientes.","Em um recipiente, adicione todos os ingredientes e misture bem até incorporar tudo;","Com ajuda de duas colheres, modele a massa formando bolinhos;","Disponhas na cestinha da Airfryer, pincele com azeite e frite por cerca de 10 minutos a 190 graus."],"origin":"source"},{"id":21,"title":"Empanadinho De Salsicha","cat":"lanches","tags":["Carne","Salgados"],"yield":"12 porções","temp":"180°C","time":"5 min","timeMin":5,"diff":"Médio","ingr":["½ xícara (chá) de leite","½ xícara (chá) de óleo","¾ de xícara (chá) de farinha de trigo","1 colher (sopa) de fermento em pó","sal a gosto","12 forminhas","1 xícara (chá) de salsichas cortadas em rodelas","½ xícara (chá) de azeitonas em fatias","queijo ralado"],"steps":["Pré-aqueça a AirFryer a 180 graus por 5 minutos até que a luz verde se apague.","Enquanto isso bata todos os ingredientes no liquidificador até ficar bem homogêneo."],"origin":"source"},{"id":22,"title":"Batatas Canoa","cat":"almoco","tags":["Legumes"],"yield":"4 porções","temp":"200°C","time":"30 min","timeMin":30,"diff":"Médio","ingr":["400g de batatas","2 colheres (sopa) de páprica picante","1 colher (sopa) de azeite","sal a gosto"],"steps":["Lave bem as batatas. Sem descascá-las, corte na vertical em formato de canoa grossa, com mais ou menos 1 dedo de espessura.","Coloque as batatas cortadas em uma vasilha e cubra com água. Deixe descansando por cerca de meia hora.","Pré-aqueça a Airfryer por 5 minutos na temperatura de 200 graus.","Escorra bem a água das batatas e seque com papel toalha ou pano limpo. Coloque-as de volta na vasilha e despeje sobre elas o azeite, o sal e a páprica. Mexa bem com as mãos para que fiquem todas cobertas uniformemente com a mistura de temperos. Despeje as batatas temperadas na cesta da fritadeira.","Programe o tempo para 30 minutos e aperte o botão ligar. Agite as batatas na metade do tempo."],"origin":"source"},{"id":23,"title":"Bife Recheado Com Queijo","cat":"almoco","tags":["Carne","Queijo"],"yield":"6 porções","temp":"200°C","time":"5 min","timeMin":5,"diff":"Fácil","ingr":["800g de carne bovina em bifes (filé mignon, contra filé, maminha ou picanha)","6 pedaços de queijo coalho tipo espeto de churrasco","sal e pimenta do reino a gosto","palitos de madeira"],"steps":["Retire os espetos de madeira do queijo, cortando-os em pedaços.","Tempere os bifes dos dois lados com sal e pimenta do reino. Coloque um pedaço de queijo dentro de cada bife e enrole. Fixe um ou dois palitos de madeira para segurar o formato.","Pré-aqueça a Airfryer por 5 minutos na temperatura de 200 graus. Após esse tempo, coloque os rolinhos dentro da Airfryer. Vire os rolinhos na metade do tempo para que todos fiquem dourados por igual."],"origin":"source"},{"id":24,"title":"Batatas Recheadas","cat":"almoco","tags":["Legumes"],"yield":"2 porções","temp":"200°C","time":"8 min","timeMin":8,"diff":"Médio","ingr":["2 batatas grandes","2 quadrados de papel alumínio","½ litro de água","2 colheres (sopa) de manteiga","1 xícara (chá) de cream cheese","½ xícara (chá) de peito de peru defumado","½ xícara de muçarela ralada"],"steps":["Lave bem as batatas, depois faça vários furos profundos nela com um garfo, e embrulhe com papel alumínio. Cozinhe as batatas em uma panela de pressão com ½ litro de água por 10 minutos.","Pré-aqueça a Airfryer por 5 minutos na temperatura de 200 graus.","Retire as batatas da panela de pressão, abra o papel alumínio somente na parte de cima.","Faça um corte na parte de cima até a metade da batata e aperte-a no sentido do comprimento para deixar a abertura maior. Polvilhe um pouco de sal. Coloque um colher (sopa) de manteiga. Distribua metade do cream cheese e do peru defumado. Cubra com a muçarela ralada.","Coloque na cesta da Airfryer, programe o tempo para 8 minutos e aperte o botão “ligar”."],"origin":"source"},{"id":25,"title":"Costela De Porco Com Mostarda E Mel","cat":"almoco","tags":["Carne"],"yield":"2 porções","temp":"200°C","time":"35 min","timeMin":35,"diff":"Médio","ingr":["½ quilo de costelinha de porco","½ xícara (chá) de mostarda amarela","½ xícara (chá) de mel","suco de ½ limão","1 colher (sopa) de alho espremido ou triturado","1 colher (sopa) de alecrim fresco ou seco","1 colher (sopa) de azeite","sal e pimenta do reino a gosto"],"steps":["Prepare a marinada com o suco do limão, o alho, alecrim, azeite, as pimentas e o sal. Misture tudo e coloque em um saco plástico e reserve.","Misture a mostarda com o mel e reserve.","Corte a costela de porco em pedaços entre os ossos. Coloque os pedaços de costela dentro do saquinho plástico com a marinada e feche bem o saco retirando o máximo de ar. Deixe marinando por no mínimo meia hora dentro da geladeira.","Pré-aqueça a Airfryer por 5 minutos na temperatura de 200 graus.","Retire as costelas do saquinho e coloque na cesta da Airfryer. Pincele com a mistura de mostarda e mel. Programe o tempo para 35 minutos e aperte o botão “ligar”. Agite a cesta na metade do tempo."],"origin":"source"},{"id":26,"title":"Iscas De Peixe","cat":"almoco","tags":["Peixe"],"yield":"4 porções","temp":"200°C","time":"18 min","timeMin":18,"diff":"Médio","ingr":["400g de filé de peixe","½ limão","sal e pimenta do reino a gosto","2 ovos","1 xícara de farinha de trigo","1 xícara de farinha de rosca misturada com 1 colher (sopa) de fubá"],"steps":["Corte os filés em tiras largas. Coloque em uma vasilha e acrescente o limão, o sal e a pimenta do reino. Deixe marinar na geladeira por cerca de 30 minutos.","Pré-aqueça a Airfryer por 5 minutos na temperatura de 200 graus.","Escorra as iscas em uma peneira e passe diretamente na farinha de trigo. Depois passe nos ovos ligeiramente batidos, e por último na mistura de farinha de rosca com fubá.","Coloque na cesta da Airfryer delicadamente tentando formar somente uma camada. Programe o tempo para 18 minutos e aperte o botão “ligar”. Agite a cesta delicadamente na metade do tempo. Se necessário acrescente mais tempo!"],"origin":"source"},{"id":27,"title":"Bife À Milanesa — Versão 1","cat":"almoco","tags":["Carne"],"yield":"4 porções","temp":"200°C","time":"10 a 15 min","timeMin":15,"diff":"Médio","ingr":["4 bifes ou filés (sem gordura e sem nervos)","1 colher (chá) de alho amassado","sal e pimenta-do-reino a gosto","1 xícara (chá) de farinha de trigo","1 e ½ xícara (chá) de farinha de rosca torrada","2 ovos"],"steps":["Reúna todos os ingredientes.","Coloque os bifes em saquinhos plásticos e bata com um batedor de carne dos dois l le o óleo (ou azeite) nos legumes e tempere bem.","Arrume na cesta da Airfryer e asse à 180 graus por 10 minutos.","Retire a cestinha, mexa os legumes e coloque novamente para assar por mais 10 minutos."],"origin":"source"},{"id":31,"title":"Camarão","cat":"almoco","tags":["Peixe"],"yield":"2 porções","temp":"180°C","time":"15 min","timeMin":15,"diff":"Médio","ingr":["300g de camarão limpo (sem rabo, cabeça e sem casca)","sal a gosto","3 dentes de alho amassados","pimenta do reino a gosto","azeite a gosto"],"steps":["Limpe os camarões e coloque-os dentro de um recipiente. Adicione o alho amassado e a pimenta do reino, misture.","Transfira os camarões para uma vasilha de silicone que caiba dentro da sua airfryer, salpique sal a gosto e regue com azeite.","Pré-aqueça a airfryer por 5 minutos a 180 graus. Depois de pré-aquecida, coloque a vasilha com os camarões dentro da airfryer e programe o tempo para 15 minutos a 180 graus;","Vire-os na metade do tempo, adicionando mais sal e azeite se desejar."],"origin":"source"},{"id":32,"title":"Capeletti Frito","cat":"janta","tags":["Massas"],"yield":"3 porções","temp":"200°C","time":"5 min","timeMin":5,"diff":"Médio","ingr":["250g de capeletti (fresco e resfriado) no sabor","desejado","2 colheres (sopa) de azeite"],"steps":["Coloque os capelettis em uma tigela e regue por cima com o azeite.","Misture muito bem, até que todos estejam bem envolvidos no azeite.","Despeje na cesta da Airfryer, e programe o tempo por 10 a 15 minutos à 200 graus.","Mexa e agite a cesta a cada 5 minutos, para que todos fiquem dourados e crocantes por igual.","Após isso, é só servir!"],"origin":"source"},{"id":33,"title":"Lasanha","cat":"janta","tags":["Massas","Carne"],"yield":"6 porções","temp":"180°C","time":"30 min","timeMin":30,"diff":"Médio","ingr":["2 envelopes de molho de tomate","200g de carne moída","150g de presunto magro","150g de muçarela fatiada","1 pacote de queijo ralado","400g de massa para lasanha pronta","1 pitada de sal","1 pitada de pimenta-do-reino","1 colher (chá) de orégano"],"steps":["Forre a Airfryer com papel alumínio.","Alterne camadas de: massa de lasanha, molho, carne moída, sal e pimenta, presunto e muçarela.","Repita o processo e finalize com queijo ralado e orégano.","Programe o tempo na Airfryer por 30 minutos na temperatura de 180 graus."],"origin":"source"},{"id":34,"title":"Empadão","cat":"janta","tags":["Carne","Salgados"],"yield":"4 porções","temp":"200°C","time":"20 a 25 min","timeMin":25,"diff":"Mais Elaborado","ingr":["§da massa","1 e ½ xícara de farinha de trigo","⅓ de xícara de manteiga ou margarina","1 ovo (clara e gema separadas)","3 colheres (sopa) parmesão ralado","½ colher (chá) de sal","½ colher (chá) de fermento químico","§do recheio","200g de frango cozido, refogado e desfiado","2 colheres (sopa) de molho ou extrato de tomates","½ xícara de requeijão cremoso","⅓ de lata de ervilhas ou milho","6 azeitonas picadas"],"steps":["Em uma tigela, coloque os ingredientes da massa. Misture tudo até obter uma massa homogênea.","Abra a massa com o rolo, ou diretamente no recipiente que irá usar.","Com o recheio já misturado, coloque por cima da massa e cubra com mais uma camada de massa. Aperte nas laterais para fechar o empadão.","Misture a gema com um fio de azeite e pincele sobre o empadão. Coloque na cesta da Airfryer e programe o tempo por 20 a 25 minutos à 200 graus."],"origin":"source"},{"id":35,"title":"Escondidinho De Carne","cat":"janta","tags":["Carne"],"yield":"2 porções","temp":"200°C","time":"15 min","timeMin":15,"diff":"Mais Elaborado","ingr":["§do creme","500g de mandioca descascadas","1 colher (sopa) de manteiga ou margarina","1 e ½ xícara de leite","sal a gosto","§do recheio","400g de carne moída","1 embalagem de molho de tomates prontos","½ cebola picada","3 dentes de alho","sal, orégano, cheiro-verde e pimenta do reino a","gosto"],"steps":["Cozinhe as mandiocas em água até ficar mole. Escorra a água e, em um recipiente, amasse bem com um garfo ou amassador.","Em uma panela, acrescente as mandiocas amassadas, a manteiga ou margarina, o leite e o sal, mexa até virar um creme e deixe ferver por 5 minutos. Desligue o fogo e reserve.","Em outra panela, coloque a carne moída e os temperos a seu gosto, refogue bem até começar a ficar mais sequinha, depois acrescente o molho de tomate e deixe ferver por 5 minutos.","Para a montagem, separe dois recipientes de um tamanho adequado para ir à airfryer. No fundo de cada recipiente, coloque o creme. Acima do creme, adicione o molho da carne moída e sobreponha com o restante do creme.","Coloque um recipiente por vez na Airfryer, programando para 15 minutos a 200 graus."],"origin":"source"},{"id":36,"title":"Hambúrguer Caseiro","cat":"janta","tags":["Carne"],"yield":"2 porções","temp":"200°C","time":"5 a 10 min","timeMin":10,"diff":"Fácil","ingr":["500g de maminha bovina moída","500g de peito bovino moído","50g de bacon triturado","sal e pimenta a gosto"],"steps":["Em uma tigela, misture as carnes e o bacon. Depois de misturados, faça bolas com as mãos, apertando para dar liga na carne.","Achate as bolas da carne com a mão ou com um modelador de hambúrguer.","Tempere os hambúrgueres com sal e pimenta dos dois lados, e coloque na Airfryer pré-aquecida por 5 a 10 minutos, na temperatura de 200 graus."],"origin":"source"},{"id":37,"title":"Cogumelos Recheados","cat":"janta","tags":["Legumes"],"yield":"8 a 10 unidades","temp":"200°C","time":"10 a 15 min","timeMin":15,"diff":"Médio","ingr":["8 a 10 cogumelos (shitake ou portobello)","100g de ricota","50g de queijo parmesão","50g de queijo mussarela","1 colher (sopa) de azeite","1 pitada de sal","pimenta do reino a gosto","ervas a gosto"],"steps":["Limpe bem os cogumelos e depois retire os caules.","Em uma tigela, misture todos os ingredientes amassando bem. Depois, com uma colher, recheie cada cogumelo.","Coloque quantos couberem dentro da cesta da Airfryer, e programe o tempo por 10 a 15 minutos na temperatura de 200 graus."],"origi timeMin":20,"diff":"Médio","ingr":["1 laranja madura","4 ovos","1 xícara óleo","2 xícaras de açúcar","2 xícaras de farinha de trigo sem fermento","1 colher (sopa) de fermento químico em pó"],"steps":["Pré-aqueça a Airfryer por 5 minutos em 180 graus. A seguir, corte a laranja em quatro partes e remova o miolo branco do meio. Retire as sementes da fruta e corte em pedaços menores, mas mantenha a casca.","Coloque os pedaços de laranja no liquidificador. Junte os ovos, o óleo e o açúcar. Bata tudo até formar uma massa homogênea.","Passe a massa do liquidificador para uma tigela. Adicione a farinha de trigo e o fermento, e misture bem até a massa ficar homogênea.","Despeje a massa em uma forma untada e enfarinhada. Leve a Airfryer para assar por aproximadamente 20 minutos. Espere esfriar antes de servir."],"origin":"source"},{"id":66,"title":"Torta De Legumes","cat":"almoco","tags":["Legumes","Zero Lactose"],"yield":"1 unidade","temp":"180°C","time":"15 min","timeMin":15,"diff":"Mais Elaborado","ingr":["½ xícara (chá) de abobrinha ralada⁣","½ xícara (chá) de milho verde⁣","½ xícara (chá) de cenoura em cubinhos","2 colheres (sopa) de cebola bem picada","¾ xícara (chá) de farinha de aveia⁣","1 colher (sobremesa) de orégano","1 colher (chá) de sal","1 ovo","2 colheres (sopa) de azeite de oliva⁣","¼ xícara (chá) de água","½ colher (sopa) de fermento químico em pó"],"steps":["Misture todos os ingredientes (menos o fermento).","Acrescente o fermento e misture novamente.","Despeje em uma forma untada com óleo (ou use forminhas de cupcake).","Programe a Airfryer para 15 minutos a 180 graus."],"origin":"source"},{"id":67,"title":"Pudim De Café","cat":"lanches","tags":["Doces","Zero Lactose"],"yield":"1 unidade","temp":"200°C","time":"30 min","timeMin":30,"diff":"Médio","ingr":["1 xícara de açúcar","500ml de leite vegetal","8 colheres (sopa) de açúcar","3 ovos","1 e ½ colher de café solúvel","15 bolachas de maizena"],"steps":["Inicialmente, derreta o açúcar e adicione em uma form gênea.","Modele pedaços dessa massa no formato de coxinha.","Misture a farinha de coco, a farinha de linhaça e o queijo ralado em um recipiente.","Passe as coxinhas nessa mistura, depois passe no ovo, e então passe novamente na mistura de farinhas e queijo ralado (até que fiquem totalmente cobertas).","Acomode as coxinhas em uma forma ou assadeira e leve à Airfryer por cerca de 15 a 25 minutos, na temperatura de 180 graus."],"origin":"source"},{"id":70,"title":"Bolinha De Queijo","cat":"petiscos","tags":["Queijo","Low Carb"],"yield":"8 unidades","temp":"200°C","time":"15 min","timeMin":15,"diff":"Médio","ingr":["150g de queijos a sua escolha","15g de requeijão","1 ovo","70g de farinha de linhaça","queijo parmesão ralado","sal e tempero a gosto"],"steps":["Pique bem os queijos e misture com o requeijão.","Faça bolinhas com a mistura (pode ser necessário acrescentar um pouco de queijo parmesão ralado para deixar a mistura consistente a esse ponto).","Empane as bolinhas duas vezes (passe as bolinhas no ovo, depois cubra com linhaça, e repita o processo mais uma ou duas vezes).","Leve as bolinhas à Airfryer na temperatura de 200 graus por cerca de 15 minutos (até que a superfície das bolinhas esteja seca)."],"origin":"source"},{"id":71,"title":"Kibe De Abóbora","cat":"petiscos","tags":["Legumes","Low Carb"],"yield":"15 unidades","temp":"180°C","time":"20 a 30 min","timeMin":30,"diff":"Médio","ingr":["250g de carne moída","100g farinha de linhaça (ou de amêndoas)","250g abóbora cozida","1 colher (sopa) de azeite","sal e tempero a gosto"],"steps":["Misture todos os ingredientes com as mãos.","Pegue pedaços da massa e enrole em formato de kibe.","Distribua os kibe em uma assadeira.","Leve a assadeira à Airfryer por cerca de 20 a 30 minutos na temperatura de 180 graus."],"origin":"source"},{"id":72,"title":"Croquete De Carne","cat":"petiscos","tags":["Carne","Low Carb"],"yield":"6 unidades","temp":"180°C","time":"10 min","timeMin":10,"diff":"Médio","ingr":["100g de acém moí  colheres (sopa) de castanha-de-caju","Queijo ralado a gosto"],"steps":["Lave bem os tomates.","Corte a tampa e retire a polpa de cada um.","Para que fiquem de pé, corte uma pequena ponta da outra extremidade e reserve.","Aqueça uma frigideira e coloque o azeite.","Refogue o alho por alguns minutos, até que fique dourado, adicione castanha, misture, até que fique um pouco tostado.","Apague o fogo e junte a ricota.","Misture bem.","Recheie os tomates um a um, e coloque num refratário previamente untado com um pouco de azeite, para não grudar.","Polvilhe um pouco de queijo ralado em cada um, e coloque no forno médio para gratinar.","Pré aqueça a sua Airfryer, coloque na cestinha os tomates recheados por 4 minutos à 200 ºC ou até que estejam macios, com a casca querendo sair."],"origin":"source"},{"id":110,"title":"Chips De Batata","cat":"petiscos","tags":["Legumes"],"yield":null,"temp":"180°C","time":"10 min","timeMin":10,"diff":"Médio","ingr":["5 batatas grandes","1 colher de sopa de azeite","Sal marinho ou sal rosa do Himalaia a gosto"],"steps":["Lave, descasque e corte as batatas em rodelas bem finas.","Pré-aqueça sua Airfryer a 200 °C; regue os vegetais com fio de azeite e misture bem, colocando-os em seguida na bandeja da sua fritadeira.","Abaixe a temperatura para 180 °C e programe o timer para 1 hora.","O tempo de cocção vai depender do alimento, por isso fique atento e, se for necessário, retire antes ou deixe na fritadeira por mais alguns minutos.","Procure virar ou mexer as batatas a cada 10 minutos, evitando que elas queimem e, ao retirar, salgue e sirva em seguida."],"origin":"source"},{"id":111,"title":"Chips De Cenoura","cat":"petiscos","tags":["Legumes"],"yield":null,"temp":"180°C","time":"10 min","timeMin":10,"diff":"Médio","ingr":["6 cenouras grandes","1 colher de sopa de azeite","Sal marinho ou sal rosa do Himalaia a gosto"],"steps":["Lave, descasque e corte as cenouras em rodelas bem finas.","Pré-aqueça sua Airfryer por cinco minutos a 200 °C, regue -a em seguida na bandeja da sua fritadeira.","Abaixe a temperatura para 180 °C e programe o timer para 40 minutos.","Procure virar a abobrinha a cada 10 minutos, evitando que ela queime e, ao retirar, salgue e sirva em seguida."],"origin":"source"},{"id":115,"title":"Chips De Batata Doce","cat":"petiscos","tags":["Legumes"],"yield":null,"temp":"180°C","time":"10 min","timeMin":10,"diff":"Médio","ingr":["5 unidades de batata doce grandes","1 colher de sopa de azeite","Sal marinho ou sal rosa do Himalaia a gosto"],"steps":["Lave, descasque e corte as batatas em rodelas bem finas.","Pré-aqueça sua Airfryer a 200 °C; regue as fatias de batata doce com azeite e misture bem, colocando-as em seguida na bandeja da fritadeira.","Abaixe a temperatura para 180 °C e programe o timer para 1 hora, pode ser necessário um pouco mais dependendo da qualidade da batata.","Procure mexer as batatas a cada 10 minutos, evitando que queimem e, ao retirar, salgue e sirva em seguida.","Pode salpicar ervas aromática ou erva fresca como cebolinha ou tomilho."],"origin":"source"},{"id":116,"title":"Mandioca Frita","cat":"petiscos","tags":["Legumes"],"yield":null,"temp":"200°C","time":"10 min","timeMin":10,"diff":"Médio","ingr":["1 mandioca","2 colheres de sopa de manteiga","1 colher de sopa de páprica doce","1 colher de chá de sal"],"steps":["Comece descascando a mandioca e cortando em pedaços, sem esquecer-se de tirar o filamento duro do meio.","Coloque numa panela, cubra com água e adicione o sal.","Cozinhe a mandioca no fogo médio por 10-15 minutos ou até ficar macia, mas não desmanchando.","Escorra a água, adicione-lhe a manteiga e a páprica e misture com cuidado, para não despedaçar.","Coloque os pedaços de mandioca no cesto da Airfryer, cuidado para não amontoar.","Asse a 200 ºC por 10 minutos ou até dourar e ficar sequinha."],"origin":"source"},{"id":117,"title":"Legumes E Ervas","cat":"almoco","tags":["Legumes"],"yield":null,"temp":"200°C","time":"15 min","timeMin":15,"diff":"Médio","ingr":["1 cenoura grande picada em fatias","3 batatas grandes cortada em fatias grossas","Sal a gosto","Limão","Pimenta a gosto","Páprica picante a gosto","Ervas a gosto","1 colher de sopa de azeite de oliva"],"steps":["Corte a cenoura e a batata em fatias de um centímetro cada.","Deixe de molho em uma tigela com água por 10 minutos.","Depois retire toda a água, adicione os temperos e o azeite misturando bem.","Coloque os legumes na cesta da Airfryer e programe para 15 minutos a 200 ºC.","Na metade do tempo, vire os legumes para cozinhar por igual, evitando queimar.","Passado esse tempo, retire e sirva."],"origin":"source"},{"id":118,"title":"Abobrinhas","cat":"almoco","tags":["Legumes"],"yield":null,"temp":"200°C","time":"15 min","timeMin":15,"diff":"Mais Elaborado","ingr":["1 abobrinha cortada em palitos","2 colheres de sopa de queijo ralado","1 colher de sopa de óleo de gergelim","Sal a gosto","Pimenta-do-reino a gosto"],"steps":["Lave a abobrinha em água corrente.","Corte em três ou quatro fatias de um centímetro de largura no sentido do comprimento.","Corte essas fatias em palitos compridos, também com um centímetro de largura.","Corte os palitos em três partes.","Tempere com sal pimenta do reino a gosto.","Distribua óleo de gergelim e o queijo ralado nos palitos envolvendo bem.","Coloque na cesta e programe para 15 minutos a 200 ºC, aos oito minutos, vire os legumes para que cozinhe igualmente e não queime."],"origin":"source"},{"id":119,"title":"Batatas Rústicas","cat":"almoco","tags":["Legumes"],"yield":null,"temp":"100°C","time":"15 min","timeMin":15,"diff":"Médio","ingr":["2 batatas médias","1 colher (sopa) de azeite","½ colher de sal (grosso)","2 colheres (sopa) de farinha de trigo"],"steps":["Lave bem as batatas e faça os cortes no sentido do comprimento.","Corte em formato de meia-lua deixar com casca.","Em seguida, coloque as batatas em um recipiente e despeje azeite e o sal grosso.","Misture bem tudo, para que o azeite cubra as batatas.","Depois vá salpicando a farinha de trigo sobre as batatas e mexa bastante.","Para finalizar, coloque as batatas na Airfryer e programe por 30 minutos em uma temperatura de 100 °C; vire as batatas aos 15 minutos para que não queime e cozinhe por igual."],"origin":"source"},{"id":120,"title":"Batata Doce Rústica","cat":"almoco","tags":["Legumes"],"yield":null,"temp":"220°C","time":"20 min","timeMin":20,"diff":"Mais Elaborado","ingr":["500 g de batata-doce","1 colher (sopa) de farinha de trigo","1 dente de alho bem picado","Ervas a gosto (alecrim, ervas finas, orégano, tomilho)","½ colher (sopa) de azeite de oliva","Páprica picante (a gosto)","Sal"],"steps":["Aqueça a sua fritadeira Airfryer a 220 ºC.","Descasque as batatas e corte em palitos uniformes.","Coloque o dente de alho picado, regue com fios de azeite de oliva e misture para que todas as batatas fiquem levemente untadas.","Em uma pequena tigela misture a farinha, a páprica e as ervas escolhidas, misture bem e polvilhe sobre as batatas.","Misture bem para que todas as faces sejam tocadas pela farinha temperada.","Coloque na Airfryer por 20 minutos ou deixe até que as batatas fiquem macias por dentro e levemente douradinhas e crocantes por fora.","Polvilhe sal e pimenta e sirva.","Poderão servir as batatas acompanhadas de uma salada de folhas de rúcula rasgadas, tomates secos, mussarela de búfala e castanha."],"origin":"source"},{"id":121,"title":"Anéis De Cebola — Versão 2","cat":"petiscos","tags":["Legumes"],"yield":null,"temp":"200°C","time":"8 min","timeMin":8,"diff":"Mais Elaborado","ingr":["2 cebolas grandes","2 colheres (chá) de sal","1 colher (sopa) de vinagre","1 colher (chá) de pimenta do reino","Farinha de rosca","2 xícaras de farinha de trigo","Orégano a gosto (opcional)","2 ovos","1 xícara de água"],"steps":["Descasque as cebolas e corte rodelas de aproximadamente um cm de espessura.","Solte os anéis e mergulhe-os na mistura de água gelada, sal e vinagre.","Deixe descansar por 15 minutos.","Separe as claras das gemas dos ovos, bata as claras em ponto de neve.","Adicione as gemas às claras e bata até obter consistência.","Acrescente o sal, pimenta, orégano e a farinha de trigo e misture delicadamente para obter uma mistura homogênea.","Em outro recipiente, coloque a farinha de rosca.","Seque os anéis de cebola com a ajuda de guardanapos para que eles fiquem bem secos.","Mergulhe os anéis na massa e então na farinha de rosca.","Coloque-os direto na Airfryer, evitando amontoar.","Frite os anéis por 8 minutos à 200 ºC ou até dourar."],"origin":"source"},{"id":122,"title":"Berinjela","cat":"almoco","tags":["Legumes"],"yield":null,"temp":"180°C","time":"20 min","timeMin":20,"diff":"Mais Elaborado","ingr":["1 berinjela média","1 xícara de farinha de trigo ou de aveia","1 xícara de farinha de rosca ou fubá fino","2 ovos batidos","Pimenta do reino","Sal"],"steps":["Comece por lavar a berinjela e cortar em rodelas com um cm de espessura ou um pouco menos.","Coloque em uma bacia com água e sal e reserve por 15 minutos, para eliminar o amargor.","Depois do tempo indicado retire as rodelas de berinjela da água e seque com papel absorvente.","Tempere a gosto com sal e pimenta e prepare os ingredientes para empanar: numa tigela coloque a farinha de trigo/aveia, noutra os ovos batidos e em outra a farinha de rosca/fubá.","Prepare a berinjela empanada: passe no trigo/aveia, depois nos ovos e, por fim, na farinha de rosca/fubá.","Coloque as rodelas de berinjela na cesta da Airfryer formando uma ou duas camadas.","Dica: Pressione ligeiramente o trigo/aveia e a farinha de rosca/fubá na berinjela para grudar bem.","Se você quiser, pode misturar oréganos ou tomilho na farinha de rosca.","Cozinhe a berinjela à milanesa na Airfryer por 15-20 minutos a 180 ºC ou até que fique dourada e crocante."],"origin":"source"},{"id":123,"title":"Pasta De Berinjela","cat":"petiscos","tags":["Legumes"],"yield":null,"temp":"200°C","time":"10 min","timeMin":10,"diff":"Mais Elaborado","ingr":["2 berinjelas médias","1 colher (chá) de alho","1 colher (sopa) de suco de limão","2 colheres (sopa) de pasta de gergelim árabe","2 colheres (sopa) de azeite de oliva extravirgem","Sal","Páprica e pimenta do reino à gosto"],"steps":["Lave bem as berinjelas e seque.","Coloque-as na Airfryer e programe por 15 minutos à 200 ºC.","Depois abra e vire as berinjelas, feche e programe por mais 10 minutos à 200 ºC.","Em seguida, retire as berinjelas da Airfryer, coloque em um prato ou travessa, corte cada uma ao meio e com auxílio de uma colher de sopa retire toda a polpa delas.","Irão sobrar apenas as cascas bem finas, pode descartar.","Coloque a polpa das berinjelas e os outros ingredientes em um processador de alimentos, bata até virar uma pasta, que pode ser mais lisa ou com pedaços.","Leve a geladeira para resfriar antes de servir, regue com um fio de azeite e cebolinha picada."],"origin":"source"},{"id":124,"title":"Couve Flor","cat":"almoco","tags":["Legumes"],"yield":null,"temp":"180°C","time":"4 min","timeMin":4,"diff":"Mais Elaborado","ingr":["1 couve flor","Sal a gosto","Pimenta do reino a gosto","Azeite ou manteiga sem sal","Ervas desidratada a gosto","Queijo ralado (opcional)"],"steps":["Lave bem a couve flor e corte em pedaços pequenos.","Coloque dentro de um recipiente e adicione um pouco de azeite ou manteiga.","Em seguida adicione sal, ervas desidratados, pimenta do reino e outros temperos a gosto.","Coloque tudo dentro do cesto da Airfryer e regue com azeite ou manteiga derretida.","Programe sua fritadeira em 15 minutos a 180 ºC até dourar.","Agite o cesto na metade do tempo do cozimento para mover as peças e fritá-las mais uniformemente.","Depois de pronto cubra com queijo ralado fresco e deixe gratinar por mais 4 minutos (opcional)."],"origin":"source"},{"id":125,"title":"Milho Assado","cat":"petiscos","tags":["Legumes"],"yield":null,"temp":"180°C","time":"20 min","timeMin":20,"diff":"Médio","ingr":["2 espigas de milho","Margarina ou manteiga a gosto","Sal a gosto","Azeite ou manteiga (opcional)"],"steps":["Lave bem as espigas de milho.","Quebre-as ao meio, polvilhe sal e azeite ou manteiga se preferir.","Pré-aqueça sua Airfryer por 5 minutos a 200 ºC; coloque as espigas dentro da cesta.","Programe para 20 minutos a 180 ºC.","Vire as espigas aos dez minutos para assar por igual."],"origin":"source"},{"id":126,"title":"Queijo Coalho","cat":"petiscos","tags":["Queijo"],"yield":null,"temp":"180°C","time":"10 min","timeMin":10,"diff":"Médio","ingr":["5 tiras de queijo coalho","Orégano (opcional)","Ervas aromática (opcional)","Manteiga, margarina ou azeite (opcional)"],"steps":["Pré-aqueça sua Airfryer por 6 minutos a 180 °C.","Coloque as tiras de queijo na cesta, pincele manteiga, margarina ou azeite se preferir.","Programe por 10 minutos a 180 °C.","OBS: A manteiga garantirá umidade, conferindo ainda mais sabor ao queijo coalho."],"origin":"source"},{"id":127,"title":"Pão De Alho Com Queijo","cat":"lanches","tags":["Pães","Queijo"],"yield":null,"temp":"200°C","time":"7 min","timeMin":7,"diff":"Mais Elaborado","ingr":["4 fatias de pão dormido","2 dentes de alho graúdos","1 colher (sobremesa) de maionese.","1 colher (sobremesa) de margarina, com ou sem sal.","3 a 4 fatias de queijo mussarela","Orégano a gosto"],"steps":["Inicialmente amasse bem os dentes de alho.","Em um pequeno recipiente acrescente a maionese e a margarina junto com o alho.","Misture tudo até ficar bem homogêneo.","Coloque o orégano.","Pegue os pães e passe o creme em cada um deles, espalhando bem.","Coloque as fatias de queijo em cima do creme de alho.","Coloque os pães na Airfryer, um ao lado do outro, por aproximadamente 7 minutos à 200 ºC."],"origin":"source"},{"id":128,"title":"Legumes","cat":"almoco","tags":["Legumes"],"yield":null,"temp":"180°C","time":"20 min","timeMin":20,"diff":"Mais Elaborado","ingr":["Couve-flor","Brócolis","Mandioquinha","Vagem","Abobrinha","Pimentão","Cúrcuma","Salsinha","Azeite","Sal"],"steps":["Cozinhe o brócolis, a couve-flor, a mandioquin
